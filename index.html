<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K25-09 Westermann-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --bg-card: #ffffff;
    --bg-card-hover: #fcfaf6;
    --ink: #1a1a1a;
    --ink-soft: #5a5a5a;
    --ink-faint: #999;
    --border: #e8e2d8;
    --border-strong: #d4ccc0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);

    --accent-grund: #1e5a96;
    --accent-grund-soft: #e1ecf6;
    --accent-fach1: #7a2238;
    --accent-fach1-soft: #f3e0e5;
    --accent-fach2: #2d6a3a;
    --accent-fach2-soft: #dcecdf;

    --accent: var(--accent-grund);
    --accent-soft: var(--accent-grund-soft);

    --correct: #2d7a3e;
    --correct-soft: #dcf0e0;
    --wrong: #b03030;
    --wrong-soft: #fce0e0;
  }

  [data-theme="dark"] {
    --bg: #16171a;
    --bg-card: #1f2125;
    --bg-card-hover: #25282d;
    --ink: #ececec;
    --ink-soft: #a8a8a8;
    --ink-faint: #6a6a6a;
    --border: #2e3138;
    --border-strong: #3a3e46;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.4);

    --accent-grund: #5b9bd5;
    --accent-grund-soft: #1f2f44;
    --accent-fach1: #d47a90;
    --accent-fach1-soft: #3a2228;
    --accent-fach2: #6db378;
    --accent-fach2-soft: #1f3322;

    --correct: #6db378;
    --correct-soft: #1f3322;
    --wrong: #d47878;
    --wrong-soft: #3a1f1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
    padding: 32px 16px;
    background-image:
      radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent) 6%, transparent) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, color-mix(in srgb, var(--accent) 4%, transparent) 0%, transparent 40%);
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .container { max-width: 760px; margin: 0 auto; }

  /* ===== HEADER ===== */
  header.app-header {
    margin-bottom: 40px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header.app-header .header-content { text-align: center; }
  header.app-header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  header.app-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(34px, 5.5vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  header.app-header h1 em {
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }
  header.app-header .sub {
    color: var(--ink-soft);
    font-size: 15px;
  }

  .theme-toggle {
    position: absolute;
    top: 0;
    right: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .theme-toggle:hover {
    color: var(--ink);
    border-color: var(--border-strong);
  }

  /* ===== GLOBAL AVERAGE BANNER ===== */
  .global-stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow);
  }
  .global-stat .gs-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .global-stat .gs-value {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .global-stat .gs-meta {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: right;
  }
  .global-stat.empty .gs-value {
    color: var(--ink-faint);
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
  }

  /* ===== CARDS ===== */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  /* ===== LERNFELD SELECTOR (overview) ===== */
  .lf-section { margin-bottom: 32px; }
  .lf-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .lf-section.grund .lf-section-title { color: var(--accent-grund); }
  .lf-section.fach1 .lf-section-title { color: var(--accent-fach1); }
  .lf-section.fach2 .lf-section-title { color: var(--accent-fach2); }

  .lf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .lf-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: inherit;
    color: inherit;
    box-shadow: var(--shadow);
    border-top: 3px solid var(--card-accent, var(--accent-grund));
    display: flex;
    flex-direction: column;
  }
  .lf-card.grund { --card-accent: var(--accent-grund); }
  .lf-card.fach1 { --card-accent: var(--accent-fach1); }
  .lf-card.fach2 { --card-accent: var(--accent-fach2); }

  .lf-card:hover:not(.disabled) {
    transform: translateY(-2px);
    background: var(--bg-card-hover);
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .lf-card.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .lf-card .lf-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--card-accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .lf-card .lf-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .lf-card .lf-meta {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .lf-card .lf-stats {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .lf-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: left;
    background: none;
    border: none;
    padding: 2px 0;
    cursor: default;
  }
  .lf-stat.clickable {
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: color 0.15s ease;
  }
  .lf-stat.clickable:hover { color: var(--card-accent); text-decoration: underline; }
  .lf-stat.best { color: var(--correct); }
  .lf-stat .stat-label { color: var(--ink-faint); }

  .lf-card .resume-banner {
    margin-top: 12px;
    padding: 8px 10px;
    background: color-mix(in srgb, var(--card-accent) 12%, transparent);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--card-accent);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== LF-DETAIL SCREEN ===== */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }
  .breadcrumb a,
  .breadcrumb button {
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s ease;
    background: transparent !important;
    border: none;
    font-family: inherit;
    font-size: inherit;
    padding: 0;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .breadcrumb a:hover,
  .breadcrumb button:hover { color: var(--accent); }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  .breadcrumb .sep { opacity: 0.4; }

  .lf-overview-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 12px;
    padding: 28px 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .lf-overview-card .lf-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .lf-overview-card h3 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .lf-overview-card .lf-overview-meta {
    color: var(--ink-soft);
    font-size: 14px;
  }
  .lf-overview-card .lf-overview-avg {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .lf-overview-card .lf-overview-avg .avg-val {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 24px;
    color: var(--correct);
    letter-spacing: -0.02em;
  }
  .lf-overview-card .lf-overview-avg .avg-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .full-lf-card {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: all 0.15s ease;
    width: 100%;
    font-family: inherit;
    text-align: left;
    box-shadow: var(--shadow);
  }
  .full-lf-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .full-lf-card .full-text { flex: 1; }
  .full-lf-card .full-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .full-lf-card .full-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.3;
  }
  .full-lf-card .full-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    opacity: 0.75;
    text-align: right;
    line-height: 1.6;
    white-space: nowrap;
  }

  .divider-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .divider-label::before,
  .divider-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .subchapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .subchapter-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    font-family: inherit;
    color: inherit;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .subchapter-card:hover:not(.disabled) {
    transform: translateY(-1px);
    background: var(--accent-soft);
  }
  .subchapter-card.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .subchapter-card .sub-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 6px;
  }
  .subchapter-card .sub-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }
  .subchapter-card .sub-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .subchapter-card .sub-title {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1.35;
  }
  .subchapter-card .sub-stats {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .subchapter-card .sub-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: left;
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .subchapter-card .sub-stat:hover { color: var(--accent); text-decoration: underline; }
  .subchapter-card .sub-stat.best { color: var(--correct); }
  .subchapter-card .sub-stat .stat-label { color: var(--ink-faint); }
  .subchapter-card .resume-banner {
    margin-top: 10px;
    padding: 6px 8px;
    background: var(--accent-soft);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
  }

  /* ===== SETTINGS BAR ===== */
  .settings {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 32px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .settings label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
  }

  /* ===== QUIZ ===== */
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }
  .q-type-badge {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 3px 9px;
    border-radius: 4px;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  .q-text {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.45;
    margin-bottom: 24px;
    color: var(--ink);
    letter-spacing: -0.005em;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    line-height: 1.45;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option.correct {
    border-color: var(--correct);
    background: var(--correct-soft);
    color: var(--ink);
  }
  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-soft);
    color: var(--ink);
  }
  .option .marker {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .option.multi .marker { border-radius: 4px; }
  .option.selected .marker { border-color: var(--accent); background: var(--accent); color: white; }
  .option.correct .marker { border-color: var(--correct); background: var(--correct); color: white; }
  .option.wrong .marker { border-color: var(--wrong); background: var(--wrong); color: white; }
  .option.disabled { cursor: default; }

  .fill-input {
    width: 100%;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }
  .fill-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .fill-input.correct { border-color: var(--correct); background: var(--correct-soft); }
  .fill-input.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .feedback.correct {
    background: var(--correct-soft);
    border-left: 3px solid var(--correct);
    color: var(--ink);
  }
  .feedback.wrong {
    background: var(--wrong-soft);
    border-left: 3px solid var(--wrong);
    color: var(--ink);
  }
  .feedback strong { color: inherit; }
  .feedback .source {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    opacity: 0.65;
  }

  /* ===== BUTTONS ===== */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.01em;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .btn.primary { background: var(--accent); color: white; }
  .btn.ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--border);
  }
  .btn.ghost:hover { color: var(--ink); border-color: var(--border-strong); }

  /* ===== RESULTS ===== */
  .result-display {
    text-align: center;
    padding: 24px 0 0;
  }
  .result-score {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 72px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.03em;
  }
  .result-score .total {
    color: var(--ink-soft);
    font-size: 32px;
  }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 8px;
    margin-bottom: 24px;
  }
  .result-message {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--ink);
    max-width: 480px;
    margin: 0 auto 24px;
  }
  .result-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 32px;
  }
  .result-scope {

          },

          }
        ]

            "q": "OPC UA ist ein herstellerunabhängiger Standard für die Machine-to-Machine-Kommunikation, der nach dem Client-Server-Prinzip arbeitet und im Gegensatz zu MQTT integrierte Sicherheitsmechanismen (Authentifizierung, Verschlüsselung, Signierung) bietet.",

          {
            "type": "mc",
            "q": "Aus welchen drei Schichten besteht die Drei-Schichten-Architektur?",
            "options": [

            "correct": 1,
            "explain": "Die Drei-Schichten-Architektur teilt die Software in Präsentationsschicht (Front End, GUI/Benutzereingaben), Logikschicht (Anwendungslogik, Datenverarbeitung) und Datenhaltungsschicht (Back End, Speichern/Laden, Datenbank). Diese Trennung reduziert Abhängigkeiten und erleichtert den Austausch einzelner Schichten.",

          },
          {

            "q": "Wie heißt das Architekturmuster (Abkürzung) für interaktive Systeme, das eine Software in Model, View und Controller aufteilt, um Daten, Darstellung und Benutzerinteraktion klar zu trennen?",
            "answers": [
              "MVC",

            ],
            "explain": "Das MVC-Muster (Model View Controller) trennt die Daten (Model), deren Darstellung (View) und die Benutzerinteraktion/Logik (Controller). Es ist eines der verbreitetsten Muster für die Präsentationsschicht. Vorteil: mehrere/austauschbare Views, synchronisierte Anzeige; Nachteil: erhöhte Komplexität.",
            "source": "LF 10a, Kap. 1.2.2"
          },
          {

            "q": "Welche Aufgaben sind im MVC-Muster korrekt zugeordnet? (Mehrfachauswahl)",

          },
          {
            "type": "tf",
            "q": "Ein Vorteil der Drei-Schichten-Architektur ist, dass Änderungen sich selten auf andere Schichten auswirken und einzelne Schichten leicht ausgetauscht werden können - ein Nachteil ist die reduzierte Ausführungsgeschwindigkeit durch die Datenweiterleitung über mehrere Schichten.",

            "source": "LF 11a, Kap. 2.1.1"

            "source": "LF 11a, Kap. 2.1.1"
          },
          {
            "type": "tf",

          },

            "type": "fill",

/* =====================================================================
   HELPERS - data shape introspection
   ===================================================================== */
function hasSubchapters(lfId) {
  const lf = QUESTIONS[lfId];
  return lf && lf.subchapters !== undefined;
}
function getSubchapterIds(lfId) {
  if (!hasSubchapters(lfId)) return [];
  return Object.keys(QUESTIONS[lfId].subchapters);
}
function getQuestionPool(lfId, subId) {
  if (!QUESTIONS[lfId]) return [];
  if (subId === null || subId === "_full") {
    // Full LF mode: combine all sub-chapters, or use flat
    if (hasSubchapters(lfId)) {
      return Object.values(QUESTIONS[lfId].subchapters).flatMap(sc => sc.questions);
    }
    return QUESTIONS[lfId].questions || [];
  }
  return QUESTIONS[lfId].subchapters[subId]?.questions || [];
}
function getTotalQuestionCount(lfId) {
  return getQuestionPool(lfId, "_full").length;
}
function getSubchapterTitle(lfId, subId) {
  return QUESTIONS[lfId]?.subchapters?.[subId]?.title || "";
}

/* =====================================================================
   STORAGE
   Schema v3:
     stats[lfId][scopeId] = { best: {attempt}, last: {attempt} }
       scopeId = "_full" or "2.4" etc.
     paused[lfId][scopeId] = { snapshot }
   ===================================================================== */
const STORAGE_KEY = "itberufe_quiz_v3";
const THEME_KEY = "itberufe_quiz_theme";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { stats: {}, paused: {} };
  } catch (e) { return { stats: {}, paused: {} }; }
}
function saveData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {}
}
function recordAttempt(lfId, scopeId, attempt) {
  const d = loadData();
  if (!d.stats[lfId]) d.stats[lfId] = {};
  if (!d.stats[lfId][scopeId]) d.stats[lfId][scopeId] = {};
  const pct = (attempt.score / attempt.total) * 100;
  const cur = d.stats[lfId][scopeId];
  const bestPct = cur.best ? (cur.best.score / cur.best.total) * 100 : -1;
  cur.last = attempt;
  if (pct > bestPct) cur.best = attempt;
  saveData(d);
}
function getStat(lfId, scopeId, which) {
  const d = loadData();
  return d.stats[lfId]?.[scopeId]?.[which] || null;
}
function clearPaused(lfId, scopeId) {
  const d = loadData();
  if (d.paused[lfId]) {
    delete d.paused[lfId][scopeId];
    if (Object.keys(d.paused[lfId]).length === 0) delete d.paused[lfId];
  }
  saveData(d);
}
function getPaused(lfId, scopeId) {
  return loadData().paused[lfId]?.[scopeId] || null;
}
function savePaused(lfId, scopeId, snapshot) {
  const d = loadData();
  if (!d.paused[lfId]) d.paused[lfId] = {};
  d.paused[lfId][scopeId] = snapshot;
  saveData(d);
}
function hasAnyPausedInLF(lfId) {
  const p = loadData().paused[lfId];
  return p && Object.keys(p).length > 0;
}

/* =====================================================================
   GLOBAL & PER-LF AVERAGES
   ===================================================================== */
function computeGlobalAverage() {
  // Average of best %ages across all (lfId, scopeId) combinations the user has attempted.
  // We count every scope the user has best-attempted (sub-chapters AND full-LFs)
  const d = loadData();
  let sum = 0, count = 0;
  Object.keys(d.stats).forEach(lfId => {
    Object.keys(d.stats[lfId]).forEach(scope => {
      const best = d.stats[lfId][scope].best;
      if (best) {
        sum += (best.score / best.total) * 100;
        count++;
      }
    });
  });
  return count === 0 ? null : { avg: sum / count, count };
}
function computeLFAverage(lfId) {
  // Average of best %ages across all scopes within this one LF.
  const d = loadData();
  const lfStats = d.stats[lfId];
  if (!lfStats) return null;
  let sum = 0, count = 0;
  Object.keys(lfStats).forEach(scope => {
    const best = lfStats[scope].best;
    if (best) {
      sum += (best.score / best.total) * 100;
      count++;
    }
  });
  return count === 0 ? null : { avg: sum / count, count };
}

/* =====================================================================
   UTILITIES
   ===================================================================== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id) {
  ["screen-select","screen-lf-detail","screen-quiz","screen-result"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[.,;:!?-]/g,"");
}
function formatDate(ts) {
  const d = new Date(ts);
  const pad = n => n.toString().padStart(2,"0");
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* =====================================================================
   THEME
   ===================================================================== */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme-icon").textContent = theme === "dark" ? "☾" : "☀";
  document.getElementById("theme-label").textContent = theme === "dark" ? "Dunkel" : "Hell";
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
}
(function initTheme() {
  let stored = "light";
  try { stored = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
  applyTheme(stored);
})();

/* =====================================================================
   OVERVIEW SCREEN
   ===================================================================== */
function renderOverview() {
  resetAccent();
  // Global stat banner
  const banner = document.getElementById("global-stat");
  const gv = document.getElementById("gs-value");
  const gm = document.getElementById("gs-meta");
  const g = computeGlobalAverage();
  if (!g) {
    banner.classList.add("empty");
    gv.textContent = "Noch keine Daten";
    gm.textContent = "Starte einen Quiz, um deine Bestleistungen zu erfassen.";
  } else {
    banner.classList.remove("empty");
    gv.textContent = Math.round(g.avg) + "%";
    gm.innerHTML = `aus ${g.count} ${g.count === 1 ? "Bestleistung" : "Bestleistungen"}<br>(Lernfelder + Unterkapitel)`;
  }

  // LF sections
  const container = document.getElementById("lf-sections");
  container.innerHTML = "";

  ["grund","fach1","fach2"].forEach(block => {
    const section = document.createElement("div");
    section.className = `lf-section ${block}`;
    const title = document.createElement("div");
    title.className = "lf-section-title";
    title.textContent = BLOCK_LABELS[block];
    section.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "lf-grid";

    LERNFELDER.filter(lf => lf.block === block).forEach(lf => {
      const btn = document.createElement("div");
      btn.className = `lf-card ${block}`;
      if (!lf.available) btn.classList.add("disabled");

      const count = lf.available ? getTotalQuestionCount(lf.id) : 0;
      const subCount = lf.available && hasSubchapters(lf.id) ? getSubchapterIds(lf.id).length : 0;
      const lfAvg = computeLFAverage(lf.id);

      let metaText;
      if (!lf.available) metaText = "in Vorbereitung";
      else if (subCount > 0) metaText = `${subCount} Unterkapitel · ${count} Fragen`;
      else metaText = `${count} Fragen im Pool`;

      let inner = `
        <div class="lf-num">${lf.num}</div>
        <div class="lf-title">${lf.title}</div>
        <div class="lf-meta">${metaText}</div>
      `;

      if (lf.available && lfAvg) {
        // Show LF-wide best/last only for flat LFs; for subchapter-LFs the average banner replaces it
        if (hasSubchapters(lf.id)) {
          inner += `<div class="lf-stats">
            <div class="lf-stat best"><span class="stat-label">Ø Bestleistung:</span> ${Math.round(lfAvg.avg)}%</div>
            <div class="lf-stat"><span class="stat-label">${lfAvg.count} ${lfAvg.count === 1 ? "Bereich" : "Bereiche"} absolviert</span></div>
          </div>`;
        } else {
          // Flat LF: best + last
          const best = getStat(lf.id, "_full", "best");
          const last = getStat(lf.id, "_full", "last");
          if (best || last) {
            inner += `<div class="lf-stats">`;
            if (best) {
              const pct = Math.round((best.score / best.total) * 100);
              inner += `<button class="lf-stat best clickable" data-act="view-best" data-lf="${lf.id}"><span class="stat-label">Bestleistung:</span> ${pct}% (${best.score}/${best.total})</button>`;
            }
            if (last) {
              const pct = Math.round((last.score / last.total) * 100);
              inner += `<button class="lf-stat clickable" data-act="view-last" data-lf="${lf.id}"><span class="stat-label">Letzter Versuch:</span> ${pct}% · ${formatDate(last.ts)}</button>`;
            }
            inner += `</div>`;
          }
        }
      }

      if (lf.available && hasAnyPausedInLF(lf.id)) {
        inner += `<div class="resume-banner">▶ Pausierte Quizze vorhanden</div>`;
      }

      btn.innerHTML = inner;

      btn.addEventListener("click", (e) => {
        if (!lf.available) return;
        const statBtn = e.target.closest("[data-act]");
        if (statBtn) {
          e.stopPropagation();
          const act = statBtn.dataset.act;
          const lfId = statBtn.dataset.lf;
          if (act === "view-best") showStoredAttempt(lfId, "_full", "best");
          if (act === "view-last") showStoredAttempt(lfId, "_full", "last");
          return;
        }
        // Flat LFs go straight into quiz; subchapter LFs go to detail screen
        if (hasSubchapters(lf.id)) {
          openLFDetail(lf.id);
        } else {
          handleQuizEntry(lf.id, "_full");
        }
      });

      grid.appendChild(btn);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

/* =====================================================================
   LF-DETAIL SCREEN (sub-chapter selector)
   ===================================================================== */
function openLFDetail(lfId) {
  const lf = LERNFELDER.find(l => l.id === lfId);
  state.lfId = lfId;
  state.block = lf.block;
  setAccentForBlock(lf.block);

  // Breadcrumb
  document.getElementById("bc-lf-current").textContent = lf.num;

  // Overview card
  const card = document.getElementById("lf-detail-card");
  const total = getTotalQuestionCount(lfId);
  const subCount = getSubchapterIds(lfId).length;
  const lfAvg = computeLFAverage(lfId);
  let cardHTML = `
    <div class="lf-num">${lf.num}</div>
    <h3>${lf.title}</h3>
    <div class="lf-overview-meta">${subCount} Unterkapitel · ${total} Fragen insgesamt im Pool</div>
  `;
  if (lfAvg) {
    cardHTML += `
      <div class="lf-overview-avg">
        <span class="avg-val">${Math.round(lfAvg.avg)}%</span>
        <span class="avg-label">Ø deiner Bestleistungen in diesem LF · aus ${lfAvg.count} ${lfAvg.count === 1 ? "Bereich" : "Bereichen"}</span>
      </div>
    `;
  }
  card.innerHTML = cardHTML;

  // Full-LF button
  const fullBest = getStat(lfId, "_full", "best");
  const fullLast = getStat(lfId, "_full", "last");
  const fullBtn = document.getElementById("btn-full-lf");
  let fullStatsHTML = `<div>${total} Fragen verfügbar</div>`;
  if (fullBest) fullStatsHTML += `<div>Best: ${Math.round((fullBest.score/fullBest.total)*100)}%</div>`;
  if (fullLast) fullStatsHTML += `<div>Letzter: ${Math.round((fullLast.score/fullLast.total)*100)}% · ${formatDate(fullLast.ts).split(" ")[0]}</div>`;
  const fullPaused = getPaused(lfId, "_full");
  fullBtn.innerHTML = `
    <div class="full-text">
      <div class="full-eyebrow">Ganzer Lernfeld-Mix${fullPaused ? " · pausiert" : ""}</div>
      <div class="full-title">Zufällige Fragen aus allen Kapiteln</div>
    </div>
    <div class="full-stats">${fullStatsHTML}</div>
  `;
  fullBtn.onclick = () => handleQuizEntry(lfId, "_full");

  // Sub-chapter grid
  const subContainer = document.getElementById("lf-detail-subchapters");
  subContainer.innerHTML = '<div class="divider-label">Oder gezielt nach Kapitel</div><div class="subchapter-grid" id="sc-grid"></div>';
  const grid = document.getElementById("sc-grid");

  getSubchapterIds(lfId).forEach(scId => {
    const sc = QUESTIONS[lfId].subchapters[scId];
    const card = document.createElement("div");
    card.className = "subchapter-card";
    const qCount = sc.questions.length;
    const disabled = qCount === 0;
    if (disabled) card.classList.add("disabled");

    const best = getStat(lfId, scId, "best");
    const last = getStat(lfId, scId, "last");
    const paused = getPaused(lfId, scId);

    let inner = `
      <div class="sub-head">
        <span class="sub-num">${scId}</span>
        <span class="sub-count">${disabled ? "in Vorbereitung" : qCount + " Fragen"}</span>
      </div>
      <div class="sub-title">${sc.title}</div>
    `;
    if (best || last) {
      inner += `<div class="sub-stats">`;
      if (best) {
        const pct = Math.round((best.score/best.total)*100);
        inner += `<button class="sub-stat best" data-sc-act="view-best" data-sc="${scId}"><span class="stat-label">Best:</span> ${pct}% (${best.score}/${best.total})</button>`;
      }
      if (last) {
        const pct = Math.round((last.score/last.total)*100);
        inner += `<button class="sub-stat" data-sc-act="view-last" data-sc="${scId}"><span class="stat-label">Letzter:</span> ${pct}% · ${formatDate(last.ts)}</button>`;
      }
      inner += `</div>`;
    }
    if (paused) {
      inner += `<div class="resume-banner">▶ Pausiert bei Frage ${paused.index + 1} von ${paused.questions.length}</div>`;
    }
    card.innerHTML = inner;

    card.addEventListener("click", (e) => {
      const statBtn = e.target.closest("[data-sc-act]");
      if (statBtn) {
        e.stopPropagation();
        const act = statBtn.dataset.scAct;
        const sc = statBtn.dataset.sc;
        if (act === "view-best") showStoredAttempt(lfId, sc, "best");
        if (act === "view-last") showStoredAttempt(lfId, sc, "last");
        return;
      }
      if (disabled) return;
      handleQuizEntry(lfId, scId);
    });

    grid.appendChild(card);
  });

  show("screen-lf-detail");
}

/* =====================================================================
   QUIZ ENTRY - decides resume vs fresh
   ===================================================================== */
function handleQuizEntry(lfId, scopeId) {
  const paused = getPaused(lfId, scopeId);
  if (paused) {
    const lf = LERNFELDER.find(l => l.id === lfId);
    const scopeLabel = scopeId === "_full" ? `${lf.num} (ganzer LF)` : `${lf.num} / ${scopeId}`;
    if (confirm(`Es gibt einen pausierten Versuch für ${scopeLabel} (Frage ${paused.index + 1} von ${paused.questions.length}). Fortsetzen?\n\nOK = Fortsetzen\nAbbrechen = Neu starten`)) {
      resumeQuiz(lfId, scopeId);
      return;
    } else {
      clearPaused(lfId, scopeId);
    }
  }
  startQuiz(lfId, scopeId);
}

/* =====================================================================
   QUIZ FLOW
   ===================================================================== */
function startQuiz(lfId, scopeId) {
  const pool = getQuestionPool(lfId, scopeId);
  if (pool.length === 0) return;
  const lf = LERNFELDER.find(l => l.id === lfId);

  const numSel = document.getElementById("num-questions").value;
  const num = numSel === "all" ? pool.length : Math.min(parseInt(numSel,10), pool.length);

  const picked = shuffle(pool).slice(0, num).map(q => {
    const copy = JSON.parse(JSON.stringify(q));
    if (copy.options && (copy.type === "mc" || copy.type === "multi")) {
      const indexed = copy.options.map((opt, i) => ({ opt, i }));
      const shuffled = shuffle(indexed);
      copy.options = shuffled.map(x => x.opt);
      const indexMap = shuffled.map(x => x.i);
      if (copy.type === "mc") {
        copy.correct = indexMap.indexOf(copy.correct);
      } else {
        copy.correct = copy.correct.map(c => indexMap.indexOf(c)).sort((a,b)=>a-b);
      }
    }
    return copy;
  });

  state.lfId = lfId;
  state.scopeId = scopeId;
  state.block = lf.block;
  state.questions = picked;
  state.index = 0;
  state.answers = [];
  state.currentSelection = null;
  state.viewingStored = false;
  state.prevScreen = hasSubchapters(lfId) ? "lf-detail" : "select";

  setAccentForBlock(lf.block);
  setQuizBreadcrumb();
  show("screen-quiz");
  renderQuestion();
}

function resumeQuiz(lfId, scopeId) {
  const paused = getPaused(lfId, scopeId);
  if (!paused) { startQuiz(lfId, scopeId); return; }
  const lf = LERNFELDER.find(l => l.id === lfId);
  state.lfId = lfId;
  state.scopeId = scopeId;
  state.block = lf.block;
  state.questions = paused.questions;
  state.index = paused.index;
  state.answers = paused.answers;
  state.currentSelection = null;
  state.viewingStored = false;
  state.prevScreen = hasSubchapters(lfId) ? "lf-detail" : "select";

  setAccentForBlock(lf.block);
  setQuizBreadcrumb();
  show("screen-quiz");
  renderQuestion();
}

function setQuizBreadcrumb() {
  const lf = LERNFELDER.find(l => l.id === state.lfId);
  document.getElementById("bc-back-lf-q").textContent = lf.num;
  document.getElementById("bc-back-lf-q").style.display = hasSubchapters(state.lfId) ? "inline" : "none";
  // Hide separator before lf-back if flat
  const seps = document.querySelectorAll("#quiz-breadcrumb .sep");
  if (!hasSubchapters(state.lfId)) {
    seps[0].style.display = "none";
  } else {
    seps[0].style.display = "inline";
  }
  const scopeLabel = state.scopeId === "_full" ? "Ganzer LF" : state.scopeId;
  document.getElementById("bc-quiz-current").textContent = scopeLabel;
}

function pauseQuiz() {
  savePaused(state.lfId, state.scopeId, {
    questions: state.questions,
    index: state.index,
    answers: state.answers,
    ts: Date.now()
  });
  goToOverview();
}

function renderQuestion() {
  const q = state.questions[state.index];
  const total = state.questions.length;

  document.getElementById("progress-fill").style.width = `${(state.index / total) * 100}%`;
  document.getElementById("q-counter").textContent = `Frage ${state.index + 1} von ${total}`;

  const typeMap = { mc: "MC", multi: "MC+", fill: "Lücke", tf: "Wahr/Falsch" };
  document.getElementById("q-type").textContent = typeMap[q.type];
  document.getElementById("q-text").textContent = q.q;

  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("btn-check").classList.remove("hidden");
  document.getElementById("btn-check").disabled = true;
  document.getElementById("btn-next").classList.add("hidden");

  const body = document.getElementById("q-body");
  body.innerHTML = "";
  state.currentSelection = null;

  if (q.type === "mc") {
    const wrap = document.createElement("div");
    wrap.className = "options";
    q.options.forEach((opt, i) => {
      const div = document.createElement("button");
      div.className = "option";
      div.type = "button";
      div.innerHTML = `<span class="marker">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
      div.addEventListener("click", () => {
        if (div.classList.contains("disabled")) return;
        wrap.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        div.classList.add("selected");
        state.currentSelection = i;
        document.getElementById("btn-check").disabled = false;
      });
      wrap.appendChild(div);
    });
    body.appendChild(wrap);
  }
  else if (q.type === "multi") {
    const wrap = document.createElement("div");
    wrap.className = "options";
    state.currentSelection = [];
    q.options.forEach((opt, i) => {
      const div = document.createElement("button");
      div.className = "option multi";
      div.type = "button";
      div.innerHTML = `<span class="marker">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
      div.addEventListener("click", () => {
        if (div.classList.contains("disabled")) return;
        const idx = state.currentSelection.indexOf(i);
        if (idx >= 0) { state.currentSelection.splice(idx,1); div.classList.remove("selected"); }
        else { state.currentSelection.push(i); div.classList.add("selected"); }
        document.getElementById("btn-check").disabled = state.currentSelection.length === 0;
      });
      wrap.appendChild(div);
    });
    body.appendChild(wrap);
  }
  else if (q.type === "fill") {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.className = "fill-input";
    inp.placeholder = "Antwort hier eingeben...";
    inp.autocomplete = "off";
    inp.addEventListener("input", () => {
      state.currentSelection = inp.value;
      document.getElementById("btn-check").disabled = inp.value.trim() === "";
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && !document.getElementById("btn-check").disabled) {
        document.getElementById("btn-check").click();
      }
    });
    body.appendChild(inp);
    setTimeout(() => inp.focus(), 50);
  }
  else if (q.type === "tf") {
    const wrap = document.createElement("div");
    wrap.className = "options";
    ["Wahr", "Falsch"].forEach((label, i) => {
      const div = document.createElement("button");
      div.className = "option";
      div.type = "button";
      div.innerHTML = `<span class="marker">${i===0?"W":"F"}</span><span>${label}</span>`;
      div.addEventListener("click", () => {
        if (div.classList.contains("disabled")) return;
        wrap.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        div.classList.add("selected");
        state.currentSelection = (i === 0);
        document.getElementById("btn-check").disabled = false;
      });
      wrap.appendChild(div);
    });
    body.appendChild(wrap);
  }
}

function checkAnswer() {
  const q = state.questions[state.index];
  let correct = false;
  let userAnswer = state.currentSelection;
  const body = document.getElementById("q-body");

  if (q.type === "mc") {
    correct = state.currentSelection === q.correct;
    body.querySelectorAll(".option").forEach((o, i) => {
      o.classList.add("disabled");
      o.classList.remove("selected");
      if (i === q.correct) o.classList.add("correct");
      else if (i === state.currentSelection) o.classList.add("wrong");
    });
  }
  else if (q.type === "multi") {
    const sel = (state.currentSelection || []).slice().sort((a,b)=>a-b);
    const cor = q.correct.slice().sort((a,b)=>a-b);
    correct = sel.length === cor.length && sel.every((v,i) => v === cor[i]);
    userAnswer = sel;
    body.querySelectorAll(".option").forEach((o, i) => {
      o.classList.add("disabled");
      o.classList.remove("selected");
      const isCorrect = cor.includes(i);
      const wasSelected = sel.includes(i);
      if (isCorrect) o.classList.add("correct");
      else if (wasSelected) o.classList.add("wrong");
    });
  }
  else if (q.type === "fill") {
    const userText = (state.currentSelection || "").trim();
    userAnswer = userText;
    correct = q.answers.some(a => normalize(a) === normalize(userText));
    const inp = body.querySelector(".fill-input");
    inp.disabled = true;
    inp.classList.add(correct ? "correct" : "wrong");
  }
  else if (q.type === "tf") {
    correct = state.currentSelection === q.correct;
    body.querySelectorAll(".option").forEach((o, i) => {
      o.classList.add("disabled");
      o.classList.remove("selected");
      const optBool = (i === 0);
      if (optBool === q.correct) o.classList.add("correct");
      else if (optBool === state.currentSelection && !correct) o.classList.add("wrong");
    });
  }

  state.answers.push({
    qText: q.q,
    type: q.type,
    correct,
    userAnswer,
    correctAnswerText: getCorrectAnswerText(q),
    explain: q.explain,
    source: q.source,
    options: q.options || null,
    answers: q.answers || null
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (correct ? "correct" : "wrong");
  let correctAnsText = "";
  if (!correct) correctAnsText = `<br><strong>Richtige Antwort:</strong> ${getCorrectAnswerText(q)}`;
  fb.innerHTML = `<strong>${correct ? "Richtig." : "Nicht ganz."}</strong>${correctAnsText}<br>${q.explain}<div class=source>${q.source}</div>`;
  fb.classList.remove("hidden");

  document.getElementById("btn-check").classList.add("hidden");
  document.getElementById("btn-next").classList.remove("hidden");
  document.getElementById("btn-next").textContent = state.index + 1 >= state.questions.length ? "Auswertung" : "Weiter";
}

function getCorrectAnswerText(q) {
  if (q.type === "mc") return q.options[q.correct];
  if (q.type === "multi") return q.correct.map(i => q.options[i]).join(", ");
  if (q.type === "fill") return q.answers[0];
  if (q.type === "tf") return q.correct ? "Wahr" : "Falsch";
  return "";
}

function nextQuestion() {
  state.index++;
  if (state.index >= state.questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function scoreMessage(score, total) {
  const pct = (score / total) * 100;
  if (pct === 100) return "Bilderbuchergebnis. Dieses Lernfeld sitzt.";
  if (pct >= 80) return "Solide Leistung. Die markierten Stellen kurz nacharbeiten.";
  if (pct >= 60) return "Grundlagen sind da - es gibt aber noch ein paar weiße Flecken.";
  if (pct >= 40) return "Halbe Strecke. Die Quellenangaben unten zeigen, wo sich ein zweiter Blick lohnt.";
  return "Hier lohnt sich noch eine Runde durch das Lehrbuch.";
}

function renderReviewList(answers) {
  const list = document.getElementById("review-list");
  list.innerHTML = "<h3>Übersicht</h3>";
  answers.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "review-item " + (a.correct ? "right" : "wrong");
    let correctAnsBlock = "";
    if (!a.correct) {
      correctAnsBlock = `<div class="review-correct-answer"><strong>Richtige Antwort:</strong> ${a.correctAnswerText}</div>`;
    }
    div.innerHTML = `
      <div class="review-head">
        <div class="review-q">${i+1}. ${a.qText}</div>
        <div class="review-status">${a.correct ? "✓ richtig" : "✗ falsch"}</div>
      </div>
      ${correctAnsBlock}
      <div class="review-explain">${a.explain}</div>
      <div class="review-source">${a.source}</div>
    `;
    list.appendChild(div);
  });
}

function showResults() {
  const total = state.questions.length;
  const score = state.answers.filter(a => a.correct).length;
  const lf = LERNFELDER.find(l => l.id === state.lfId);
  const scopeLabel = state.scopeId === "_full" ? `${lf.num} · ganzer LF-Mix` : `${lf.num} · Kapitel ${state.scopeId} (${getSubchapterTitle(state.lfId, state.scopeId)})`;

  document.getElementById("r-scope").textContent = scopeLabel;
  document.getElementById("r-score").textContent = score;
  document.getElementById("r-total").textContent = total;
  document.getElementById("r-label").textContent = "Ergebnis";
  document.getElementById("r-message").textContent = scoreMessage(score, total);
  document.getElementById("r-meta").textContent = formatDate(Date.now());
  document.getElementById("btn-retry").textContent = "Nochmal mit neuen Fragen";

  setResultBreadcrumb("Ergebnis");
  renderReviewList(state.answers);

  // Persist
  const attempt = {
    score, total, ts: Date.now(),
    questions: state.questions,
    answers: state.answers
  };
  recordAttempt(state.lfId, state.scopeId, attempt);
  clearPaused(state.lfId, state.scopeId);
  state.viewingStored = false;

  show("screen-result");
}

function showStoredAttempt(lfId, scopeId, which) {
  const attempt = getStat(lfId, scopeId, which);
  if (!attempt) return;
  const lf = LERNFELDER.find(l => l.id === lfId);

  state.lfId = lfId;
  state.scopeId = scopeId;
  state.block = lf.block;
  state.questions = attempt.questions;
  state.answers = attempt.answers;
  state.viewingStored = true;
  // Where did we come from? Detail screen if from sub-chapter card, overview if flat
  state.prevScreen = hasSubchapters(lfId) ? "lf-detail" : "select";

  setAccentForBlock(lf.block);

  const scopeLabel = scopeId === "_full" ? `${lf.num} · ganzer LF-Mix` : `${lf.num} · Kapitel ${scopeId} (${getSubchapterTitle(lfId, scopeId)})`;
  document.getElementById("r-scope").textContent = scopeLabel;
  document.getElementById("r-score").textContent = attempt.score;
  document.getElementById("r-total").textContent = attempt.total;
  document.getElementById("r-label").textContent = which === "best" ? "Bestleistung" : "Letzter Versuch";
  document.getElementById("r-message").textContent = scoreMessage(attempt.score, attempt.total);
  document.getElementById("r-meta").textContent = formatDate(attempt.ts);
  document.getElementById("btn-retry").textContent = "Neue Runde dieses Bereichs";

  setResultBreadcrumb(which === "best" ? "Bestleistung" : "Letzter Versuch");
  renderReviewList(attempt.answers);

  show("screen-result");
}

function setResultBreadcrumb(currentLabel) {
  const lf = LERNFELDER.find(l => l.id === state.lfId);
  document.getElementById("bc-back-lf-r").textContent = lf.num;
  const seps = document.querySelectorAll("#result-breadcrumb .sep");
  if (!hasSubchapters(state.lfId)) {
    seps[0].style.display = "none";
    document.getElementById("bc-back-lf-r").style.display = "none";
  } else {
    seps[0].style.display = "inline";
    document.getElementById("bc-back-lf-r").style.display = "inline";
  }
  document.getElementById("bc-result-current").textContent = currentLabel;
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
function goToOverview() {
  resetAccent();
  renderOverview();
  show("screen-select");
}
function goToLFDetail() {
  if (state.lfId && hasSubchapters(state.lfId)) {
    openLFDetail(state.lfId);
  } else {
    goToOverview();
  }
}

/* =====================================================================
   EVENT WIRING
   ===================================================================== */
document.getElementById("btn-check").addEventListener("click", checkAnswer);
document.getElementById("btn-next").addEventListener("click", nextQuestion);
document.getElementById("btn-abort").addEventListener("click", pauseQuiz);
document.getElementById("btn-back").addEventListener("click", () => {
  if (state.prevScreen === "lf-detail") goToLFDetail();
  else goToOverview();
});
document.getElementById("btn-retry").addEventListener("click", () => {
  if (state.lfId && state.scopeId) startQuiz(state.lfId, state.scopeId);
});
document.getElementById("btn-reset").addEventListener("click", () => {
  if (confirm("Alle Fortschritte (Bestleistungen, letzte Versuche und pausierte Quizze) löschen?")) {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderOverview();
  }
});
document.getElementById("theme-toggle").addEventListener("click", toggleTheme);

document.getElementById("bc-back-overview").addEventListener("click", goToOverview);
document.getElementById("bc-back-overview-q").addEventListener("click", goToOverview);
document.getElementById("bc-back-overview-r").addEventListener("click", goToOverview);
document.getElementById("bc-back-lf-q").addEventListener("click", goToLFDetail);
document.getElementById("bc-back-lf-r").addEventListener("click", goToLFDetail);

renderOverview();
show("screen-select");
</script>
