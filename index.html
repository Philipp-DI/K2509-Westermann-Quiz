<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K25-09 Westermann-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --bg-card: #ffffff;
    --bg-card-hover: #fcfaf6;
    --ink: #1a1a1a;
    --ink-soft: #5a5a5a;
    --ink-faint: #999;
    --border: #e8e2d8;
    --border-strong: #d4ccc0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);

    --accent-grund: #1e5a96;
    --accent-grund-soft: #e1ecf6;
    --accent-fach1: #7a2238;
    --accent-fach1-soft: #f3e0e5;
    --accent-fach2: #2d6a3a;
    --accent-fach2-soft: #dcecdf;

    --accent: var(--accent-grund);
    --accent-soft: var(--accent-grund-soft);

    --correct: #2d7a3e;
    --correct-soft: #dcf0e0;
    --wrong: #b03030;
    --wrong-soft: #fce0e0;
  }

  [data-theme="dark"] {
    --bg: #16171a;
    --bg-card: #1f2125;
    --bg-card-hover: #25282d;
    --ink: #ececec;
    --ink-soft: #a8a8a8;
    --ink-faint: #6a6a6a;
    --border: #2e3138;
    --border-strong: #3a3e46;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.4);

    --accent-grund: #5b9bd5;
    --accent-grund-soft: #1f2f44;
    --accent-fach1: #d47a90;
    --accent-fach1-soft: #3a2228;
    --accent-fach2: #6db378;
    --accent-fach2-soft: #1f3322;

    --correct: #6db378;
    --correct-soft: #1f3322;
    --wrong: #d47878;
    --wrong-soft: #3a1f1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
    padding: 32px 16px;
    background-image:
      radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent) 6%, transparent) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, color-mix(in srgb, var(--accent) 4%, transparent) 0%, transparent 40%);
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .container { max-width: 760px; margin: 0 auto; }

  /* ===== HEADER ===== */
  header.app-header {
    margin-bottom: 40px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header.app-header .header-content { text-align: center; }
  header.app-header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  header.app-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(34px, 5.5vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  header.app-header h1 em {
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }
  header.app-header .sub {
    color: var(--ink-soft);
    font-size: 15px;
  }

  .theme-toggle {
    position: absolute;
    top: 0;
    right: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .theme-toggle:hover {
    color: var(--ink);
    border-color: var(--border-strong);
  }

  /* ===== GLOBAL AVERAGE BANNER ===== */
  .global-stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow);
  }
  .global-stat .gs-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .global-stat .gs-value {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .global-stat .gs-meta {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: right;
  }
  .global-stat.empty .gs-value {
    color: var(--ink-faint);
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
  }

  /* ===== CARDS ===== */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  /* ===== LERNFELD SELECTOR (overview) ===== */
  .lf-section { margin-bottom: 32px; }
  .lf-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .lf-section.grund .lf-section-title { color: var(--accent-grund); }
  .lf-section.fach1 .lf-section-title { color: var(--accent-fach1); }
  .lf-section.fach2 .lf-section-title { color: var(--accent-fach2); }

  .lf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .lf-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: inherit;
    color: inherit;
    box-shadow: var(--shadow);
    border-top: 3px solid var(--card-accent, var(--accent-grund));
    display: flex;
    flex-direction: column;
  }
  .lf-card.grund { --card-accent: var(--accent-grund); }
  .lf-card.fach1 { --card-accent: var(--accent-fach1); }
  .lf-card.fach2 { --card-accent: var(--accent-fach2); }

  .lf-card:hover:not(.disabled) {
    transform: translateY(-2px);
    background: var(--bg-card-hover);
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .lf-card.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .lf-card .lf-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--card-accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .lf-card .lf-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .lf-card .lf-meta {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .lf-card .lf-stats {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .lf-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: left;
    background: none;
    border: none;
    padding: 2px 0;
    cursor: default;
  }
  .lf-stat.clickable {
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: color 0.15s ease;
  }
  .lf-stat.clickable:hover { color: var(--card-accent); text-decoration: underline; }
  .lf-stat.best { color: var(--correct); }
  .lf-stat .stat-label { color: var(--ink-faint); }

  .lf-card .resume-banner {
    margin-top: 12px;
    padding: 8px 10px;
    background: color-mix(in srgb, var(--card-accent) 12%, transparent);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--card-accent);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== LF-DETAIL SCREEN ===== */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }
  .breadcrumb a,
  .breadcrumb button {
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s ease;
    background: transparent !important;
    border: none;
    font-family: inherit;
    font-size: inherit;
    padding: 0;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .breadcrumb a:hover,
  .breadcrumb button:hover { color: var(--accent); }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  .breadcrumb .sep { opacity: 0.4; }

  .lf-overview-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 12px;
    padding: 28px 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .lf-overview-card .lf-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .lf-overview-card h3 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .lf-overview-card .lf-overview-meta {
    color: var(--ink-soft);
    font-size: 14px;
  }
  .lf-overview-card .lf-overview-avg {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .lf-overview-card .lf-overview-avg .avg-val {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 24px;
    color: var(--correct);
    letter-spacing: -0.02em;
  }
  .lf-overview-card .lf-overview-avg .avg-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .full-lf-card {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: all 0.15s ease;
    width: 100%;
    font-family: inherit;
    text-align: left;
    box-shadow: var(--shadow);
  }
  .full-lf-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .full-lf-card .full-text { flex: 1; }
  .full-lf-card .full-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .full-lf-card .full-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.3;
  }
  .full-lf-card .full-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    opacity: 0.75;
    text-align: right;
    line-height: 1.6;
    white-space: nowrap;
  }

  .divider-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .divider-label::before,
  .divider-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .subchapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .subchapter-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    font-family: inherit;
    color: inherit;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .subchapter-card:hover:not(.disabled) {
    transform: translateY(-1px);
    background: var(--accent-soft);
  }
  .subchapter-card.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .subchapter-card .sub-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 6px;
  }
  .subchapter-card .sub-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }
  .subchapter-card .sub-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .subchapter-card .sub-title {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1.35;
  }
  .subchapter-card .sub-stats {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .subchapter-card .sub-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: left;
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .subchapter-card .sub-stat:hover { color: var(--accent); text-decoration: underline; }
  .subchapter-card .sub-stat.best { color: var(--correct); }
  .subchapter-card .sub-stat .stat-label { color: var(--ink-faint); }
  .subchapter-card .resume-banner {
    margin-top: 10px;
    padding: 6px 8px;
    background: var(--accent-soft);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
  }

  /* ===== SETTINGS BAR ===== */
  .settings {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 32px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .settings label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
  }

  /* ===== QUIZ ===== */
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }
  .q-type-badge {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 3px 9px;
    border-radius: 4px;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  .q-text {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.45;
    margin-bottom: 24px;
    color: var(--ink);
    letter-spacing: -0.005em;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    line-height: 1.45;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option.correct {
    border-color: var(--correct);
    background: var(--correct-soft);
    color: var(--ink);
  }
  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-soft);
    color: var(--ink);
  }
  .option .marker {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .option.multi .marker { border-radius: 4px; }
  .option.selected .marker { border-color: var(--accent); background: var(--accent); color: white; }
  .option.correct .marker { border-color: var(--correct); background: var(--correct); color: white; }
  .option.wrong .marker { border-color: var(--wrong); background: var(--wrong); color: white; }
  .option.disabled { cursor: default; }

  .fill-input {
    width: 100%;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }
  .fill-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .fill-input.correct { border-color: var(--correct); background: var(--correct-soft); }
  .fill-input.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .feedback.correct {
    background: var(--correct-soft);
    border-left: 3px solid var(--correct);
    color: var(--ink);
  }
  .feedback.wrong {
    background: var(--wrong-soft);
    border-left: 3px solid var(--wrong);
    color: var(--ink);
  }
  .feedback strong { color: inherit; }
  .feedback .source {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    opacity: 0.65;
  }

  /* ===== BUTTONS ===== */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.01em;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .btn.primary { background: var(--accent); color: white; }
  .btn.ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--border);
  }
  .btn.ghost:hover { color: var(--ink); border-color: var(--border-strong); }

  /* ===== RESULTS ===== */
  .result-display {
    text-align: center;
    padding: 24px 0 0;
  }
  .result-score {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 72px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.03em;
  }
  .result-score .total {
    color: var(--ink-soft);
    font-size: 32px;
  }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 8px;
    margin-bottom: 24px;
  }
  .result-message {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--ink);
    max-width: 480px;
    margin: 0 auto 24px;
  }
  .result-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 32px;
  }
  .result-scope {

            correct: 0,
            explain: "Das EVA-Prinzip beschreibt die drei Grundfunktionen eines Computers: Eingabe der Daten, Verarbeitung in der Zentraleinheit, Ausgabe der Ergebnisse. Für einen funktionierenden Computer werden mindestens eine Zentraleinheit, eine Eingabe- und eine Ausgabeeinheit benötigt.",
            source: "LF 2, Kap. 2.1.1" },
          { type: "mc", q: "Was beschreibt der Begriff \"Konfiguration\" im IT-Kontext?",
            options: ["Die reine Hardware-Ausstattung eines Computers","Die Zusammenstellung, Einstellungen und Abstimmung von Komponenten, Geräten und Programmen auf eine Anwendung","Die Anbindung eines Computers an das Netzwerk","Das Update von Treibern und Software"],
            correct: 1,
            explain: "Konfiguration bezeichnet die Zusammenstellung, Einstellungen und Abstimmungen von Komponenten, Geräten und Programmen in Bezug auf die Anwendungen. Je nach Einsatzzweck werden Geräte und Komponenten zu einer maßgeschneiderten Konfiguration zusammengestellt.",
            source: "LF 2, Kap. 2.1.1" },
          { type: "tf", q: "Die Festplatte zählt zu den Peripheriegeräten eines Computers.",
            correct: true,
            explain: "Korrekt. Peripheriegeräte sind alle Geräte zur Eingabe, Ausgabe und Speicherung der Daten - die Festplatte gehört als externe Speichereinheit dazu. Zur Zentraleinheit zählen nur CPU, RAM und Mainboard.",
            source: "LF 2, Kap. 2.1.1" },
          { type: "multi", q: "Welche Aussagen beschreiben Ziele der Datenverarbeitung korrekt? (Mehrfachauswahl)",
            options: [
              "Schnelle Verarbeitung großer Datenmengen",
              "Beseitigung monotoner Routinetätigkeiten",
              "Maximierung des Personalbestands",
              "Bessere Kommunikation durch Integration und Vernetzung",
              "Höhere Wirtschaftlichkeit durch geringere Personal- und Sachkosten"
            ],
            correct: [0, 1, 3, 4],
            explain: "Ziele der Datenverarbeitung: schnelle Verarbeitung großer Datenmengen, Beseitigung monotoner Routinetätigkeiten, Automatisierung und Verbesserung der Abläufe, bessere Informations- und Kommunikationssysteme, höhere Wirtschaftlichkeit durch geringere Personal- und Sachkosten. Personalwachstum ist ausdrücklich kein Ziel.",
            source: "LF 2, Kap. 2.1.1" },
          { type: "fill", q: "Wie heißt die in den 1940er-Jahren entwickelte Computerarchitektur, bei der ein gemeinsamer Speicher sowohl Programmbefehle als auch Daten hält?",
            answers: ["Von-Neumann-Architektur", "Von Neumann Architektur", "Von-Neumann-Rechner-Architektur"],
            explain: "Die Von-Neumann-Architektur (1940er-Jahre) ist das klassische Referenzmodell: gemeinsamer Speicher für Programme und Daten, Komponenten wie Rechenwerk, Steuerwerk, Arbeitsspeicher, Bussystem und Input/Output. Sie ermöglicht Programmänderungen ohne Hardware-Eingriffe. Konrad Zuse hatte ähnliche Überlegungen, baute 1941 den ersten funktionsfähigen Digitalcomputer.",
            source: "LF 2, Kap. 2.1.2" },
          { type: "mc", q: "Was besagt das sogenannte Mooresche Gesetz vereinfacht?",
            options: [
              "Die Speicherkapazität halbiert sich alle 5 Jahre",
              "Die Leistung von Mikroprozessoren verdoppelt sich etwa alle 18 Monate",
              "Die Hardwarepreise verdoppeln sich alle 24 Monate",
              "Quantencomputer sind dreimal schneller als klassische Computer"
            ],
            correct: 1,
            explain: "Nach Moores Gesetz verdoppelt sich die Leistung von Mikroprozessoren etwa alle 18 Monate. Heute stößt diese Entwicklung an physikalische Grenzen des Materials - statt der Taktfrequenz wird die Leistung u.a. durch mehr Kerne, größere Caches und intelligentere Architekturen gesteigert.",
            source: "LF 2, Kap. 2.1.2" },
          { type: "mc", q: "Welche der folgenden Aussagen über die Zentraleinheit eines Computers ist korrekt?",
            options: [
              "Die Leistungsfähigkeit der Zentraleinheit ist nebensächlich für die Gesamtleistung",
              "Die Zentraleinheit verarbeitet die Daten und entscheidet wesentlich über die Leistungsfähigkeit des Systems",
              "Die Zentraleinheit umfasst auch Monitor und Tastatur",
              "Die Zentraleinheit ist immer ein einzelner Chip"
            ],
            correct: 1,
            explain: "Die Zentraleinheit (Mainboard, CPU, RAM) verarbeitet die Daten und entscheidet wesentlich über die Leistungsfähigkeit des Gesamtsystems. Sie ist klar abgegrenzt von Peripheriegeräten wie Monitor und Tastatur, die zur Ein-/Ausgabe und Speicherung dienen.",
            source: "LF 2, Kap. 2.1.1" },
          { type: "tf", q: "Für die Funktion eines Computers werden mindestens die Zentraleinheit und zwei Peripheriegeräte (eine Eingabe- und eine Ausgabeeinheit) benötigt.",
            correct: true,
            explain: "Korrekt. Die Minimalkonfiguration eines arbeitsfähigen Computers besteht aus der Zentraleinheit und mindestens zwei Peripheriegeräten - eines zur Eingabe (z.B. Tastatur), eines zur Ausgabe (z.B. Monitor). Ohne Eingabe wären keine Daten zur Verarbeitung verfügbar, ohne Ausgabe keine Ergebnisse sichtbar.",
            source: "LF 2, Kap. 2.1.1" },
          { type: "fill", q: "Wie nennt man die Unterscheidung von IT-Systemen in Bestandteile wie Hardware, Firmware und Software?",
            answers: ["Bestandteile", "Komponenten"],
            explain: "IT-Systeme werden typischerweise in drei Bestandteile gegliedert: Hardware (Zentraleinheit, Peripherie), Firmware (z.B. fest eingebautes BIOS, Systemsoftware, Utilities) und Software (Standard-, Anwendungs-, Branchen-, Individualsoftware). Die Hardware ist greifbar, die Software immateriell, die Firmware bildet die Brücke.",
            source: "LF 2, Kap. 2.1.4" },
          { type: "mc", q: "Welche Aussage zur Unterscheidung zwischen LAN, MAN und WAN trifft zu?",
            options: [
              "LAN deckt Kontinente ab, WAN nur ein Gebäude",
              "LAN ist ein lokales Netzwerk, MAN umfasst Städte/Regionen, WAN spannt sich über Länder und Kontinente",
              "MAN und WAN sind Synonyme für dasselbe Netz",
              "LAN ist drahtlos, WAN immer kabelgebunden"
            ],
            correct: 1,
            explain: "Die geografische Abgrenzung: LAN (Local Area Network) - lokal, etwa in einem Gebäude. MAN (Metropolitan Area Network) - Stadt- oder Regionsebene. WAN (Wide Area Network) - länder- und kontinentübergreifend. Drahtlosvarianten heißen z.B. WLAN.",
            source: "LF 2, Kap. 2.1.4" }
        ]
      },

          { type: "mc", q: "Was beschreibt der Begriff IT-Sourcing?",

            source: "LF 2, Kap. 2.2.3" },
          { type: "fill", q: "Wie heißt die unbefristete Auslagerung umfangreicher IT-Aufgaben oder -Bereiche an ein externes Unternehmen in eigener Verantwortung, jedoch mit Vertragsbindung?",
            answers: ["Outsourcing", "IT-Outsourcing"],
            explain: "Outsourcing bedeutet \"von außen beziehen\" (Outside Resource Using). Es handelt sich um die unbefristete Auslagerung von IT-Aufgaben an externe Unternehmen. Dabei gehen oft Systeme und Personal auf den Dienstleister über. Beim Selective Outsourcing werden nur einzelne Bereiche ausgelagert.",

          { type: "mc", q: "Was sind Managed-Services im IT-Bereich?",
            options: [

              "Die ausschließlich automatisierten Backup-Dienste"

            correct: 1,
            explain: "Managed-Services sind wiederkehrende IT-Dienstleistungen per Rahmenvertrag - Umfang und Verfügbarkeit werden durch Service Level Agreements (SLAs) definiert. Beispiele: Server- und Netzwerkbetreuung, Help-Desk, Cloud-Services. Leistungen können je nach Vertrag bedarfsgerecht abgerufen werden.",
            source: "LF 2, Kap. 2.2.3" },
          { type: "tf", q: "Service Level Agreements (SLAs) regeln Umfang, Art und Qualität der zu erbringenden Leistungen zwischen Unternehmen und Dienstleister und sind Vertragsbestandteil.",
            correct: true,
            explain: "Korrekt. SLAs werden im Vorfeld zwischen Unternehmen und Dienstleister festgelegt und abgestimmt. Sie sind Vertragsbestandteil und dienen als Grundlage zur Überwachung und Bewertung der Leistungserbringung.",
            source: "LF 2, Kap. 2.2.3" },
          { type: "mc", q: "Welches Cloud-Servicemodell stellt dem Kunden Hardware-Ressourcen wie Rechenleistung und Speicher als Dienstleistung bereit?",

              "Platform as a Service (PaaS)",
              "Infrastructure as a Service (IaaS)",

            ],
            correct: 2,
            explain: "Die drei klassischen Cloud-Servicemodelle: IaaS liefert Hardware (Server, Storage, Netz), PaaS liefert Laufzeit- und Entwicklungsumgebungen, SaaS liefert fertige Software nach Bedarf (on demand). Je weiter oben im Stack, desto weniger muss der Kunde selbst administrieren.",
            source: "LF 2, Kap. 2.2.3" },
          { type: "fill", q: "Wie heißt das Anbieten von Anwendungen (z.B. eines ERP-Systems) durch einen Dienstleister über eine Datenleitung, in der Regel auf Basis eines Mietvertrags? (Abkürzung mit drei Buchstaben)",

            explain: "Application Service Providing (ASP) ist eine Anwendungsdienstleistung: Über eine Datenleitung erhält das Kundenunternehmen Anwendungen mit Dienstleistungen - meist per Mietvertrag. ASP gilt als Vorläuferkonzept des heutigen SaaS.",
            source: "LF 2, Kap. 2.2.3" },
          { type: "mc", q: "Was beschreibt das On-Site-Management?",

            source: "LF 2, Kap. 2.2.3" },
          { type: "multi", q: "Welche Leistungsbereiche umfasst ein typisches Leistungsportfolio eines Systemhauses laut Lehrbuch? (Mehrfachauswahl)",

            source: "LF 2, Kap. 2.2.1" },
          { type: "mc", q: "Welche Unterscheidung trifft das Lehrbuch zwischen Standardarbeitsplätzen und Arbeitsplätzen mit leistungsstarken Anwendungen?",

      "2.3": {
        title: "Auswahlkriterien zu IT-Produkten unterscheiden",
        questions: [
          { type: "fill", q: "Wie heißt der Leitbegriff für eine Unternehmenskultur, die IT möglichst umweltschonend beschafft, einsetzt und entsorgt - mit ganzheitlicher Betrachtung von Beschaffung, Nutzung, Verwertung und Entsorgung?",
            answers: ["Green-IT", "Green IT", "GreenIT"],
            explain: "Green-IT zielt auf eine ganzheitliche, ressourcenschonende Betrachtung des IT-Lebenszyklus. Maßnahmen: schlanke Architektur, energieeffiziente Komponenten, Virtualisierung, längere Nutzungsdauer, Refurbished IT, BYOD-Konzepte. Überprüfbar durch Nachhaltigkeitsrichtlinien und -berichte.",
            source: "LF 2, Kap. 2.3.2" },
          { type: "mc", q: "Was beschreibt der Begriff BYOD (Bring Your Own Device) im betrieblichen Kontext?",

            correct: 1,
            explain: "BYOD steht für die betriebliche Nutzung privater Geräte durch Mitarbeiter. Vorteil: Ressourceneinsparung, geringerer Beschaffungsaufwand, Mitarbeiterzufriedenheit. Mitarbeiter erhalten ggf. Zuschüsse. Herausforderung: IT-Sicherheit, Datenschutz und Trennung von privaten und betrieblichen Daten müssen geregelt sein.",

          { type: "tf", q: "Bei der Beschaffung von IT-Systemen sind die Schutzziele Vertraulichkeit, Integrität und Verfügbarkeit unabhängig vom Arbeitsplatz pauschal anzuwenden.",
