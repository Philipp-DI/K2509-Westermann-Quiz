            explain: "Falsch. Die Schutzziele sind grundsätzlich relevant, aber die Anforderungen müssen je nach Arbeitsplatz und Schutzbedarf differenziert betrachtet werden. Für Standardarbeitsplätze reichen Standardanforderungen (pauschal), für Spezialanforderungen ist eine Anforderungsanalyse oder ein Lasten-/Pflichtenheft nötig. Die Schutzbedarfsanalyse selbst wird in LF 4 vertieft.",
            source: "LF 2, Kap. 2.3.4, vgl. LF 4" },
          { type: "fill", q: "Welche ISO-Norm regelt die Ergonomie der Mensch-System-Interaktion und ist damit für Bildschirmarbeitsplätze relevant?",
            answers: ["ISO 9241", "DIN EN ISO 9241"],
            explain: "Die ISO 9241 \"Ergonomie der Mensch-System-Interaktion\" regelt Anforderungen an Bildschirmarbeitsplätze, Software-Ergonomie und Benutzerfreundlichkeit. Sie ist die wichtigste Bezugsnorm für ergonomische Anforderungen am Arbeitsplatz.",
            source: "LF 2, Kap. 2.3.1" },
          { type: "mc", q: "Welche ISO-Norm definiert acht Qualitätskriterien für Softwareentwicklung (u.a. Functional Suitability, Reliability, Performance Efficiency, Security)?",
            options: ["ISO 9000","ISO 14000","ISO/IEC 25010","ISO 9241"],
            correct: 2,
            explain: "ISO/IEC 25010 definiert acht Qualitätskriterien für Software: funktionale Eignung, Verlässlichkeit, Performance, Kompatibilität, Bedienbarkeit, Sicherheit, Wartbarkeit, Portabilität. Sie ist für Softwareentwickler die zentrale Bezugsnorm und wird in LF 5 vertieft.",
            source: "LF 2, Kap. 2.3.1" },
          { type: "multi", q: "Welche der genannten Normen sind für IT-Qualität und -Sicherheit besonders relevant? (Mehrfachauswahl)",
            options: ["ISO 9000 (Qualitätsmanagement)","ISO 9241 (Ergonomie)","ISO 14000 (Umweltmanagement)","ISO/IEC 27001 (Informationssicherheit)","ISO 6346 (Frachtcontainer-Codierung)"],
            correct: [0, 1, 2, 3],
            explain: "Die ersten vier sind direkt IT- oder arbeitsplatzbezogen: Qualitätsmanagement (9000), Ergonomie der Mensch-System-Interaktion (9241), Umweltmanagement (14000), Informationssicherheit (27001). ISO 6346 für Frachtcontainer hat mit IT nichts zu tun.",
            source: "LF 2, Kap. 2.3.1" },
          { type: "fill", q: "Wie heißen Prüfdokumente, die von anerkannten Stellen nach Prüfung von Produkten, Verfahren oder Leistungen ausgestellt werden und i.d.R. die Einhaltung von Normen bestätigen?",
            answers: ["Zertifikate", "Zertifikat", "Zertifizierung", "Zertifizierungen"],
            explain: "Zertifikate werden von anerkannten Zertifizierungsstellen nach einer Prüfung ausgestellt. Sie bestätigen i.d.R. die Einhaltung bestimmter Normen (z.B. ISO 9001 für Qualitätsmanagement). Sie sind ein wichtiges Marketing- und Qualitätsmerkmal für Anbieter.",
            source: "LF 2, Kap. 2.3.1" },
          { type: "tf", q: "Marken sind Schutzzeichen, die Unternehmen beim Deutschen Patent- und Markenamt für Wörter, Bilder, Töne und andere Unterscheidungskennzeichen registrieren lassen können.",
            correct: true,
            explain: "Korrekt. Marken (brands) sind beim DPMA (Deutsches Patent- und Markenamt, www.dpma.de) registrierte Schutzzeichen. Unternehmen versuchen, Leistungen und Erfolge mit ihrer Marke zu verbinden und Marktvorteile zu erlangen. Amazon, Apple und Google gehören weltweit zu den wertvollsten Marken.",
            source: "LF 2, Kap. 2.3.1" },
          { type: "mc", q: "Welche der acht Qualitätskriterien nach ISO/IEC 25010 beschreibt die Eigenschaft \"leicht installierbar, leicht auf andere Systeme übertragbar\"?",
            options: ["Reliability (Verlässlichkeit)","Portability (Portabilität)","Security (Sicherheit)","Maintainability (Wartbarkeit)"],
            correct: 1,
            explain: "Portability (Portabilität) beschreibt, wie leicht sich Software installieren und auf andere Umgebungen übertragen lässt. Die anderen Kriterien: Reliability = ausgereift/fehlertolerant; Security = Datensicherheit, Manipulationsschutz; Maintainability = leicht wartbar, gesetzeskonform.",
            source: "LF 2, Kap. 2.3.1" },
          { type: "fill", q: "Welche Abkürzung steht für die Konstruktionsvorgaben (z.B. Größe, Anschlüsse) bei Mainboards, Gehäusen oder Einsteckkarten - so genannte Industriestandards?",
            answers: ["Formfaktor", "Formfaktoren"],
            explain: "Formfaktoren sind Konstruktionsvorgaben für bestimmte Größen, Formen und Anschlüsse, die sich am Markt durchgesetzt haben - z.B. ATX/Micro-ATX bei Mainboards, M.2 bei SSDs. Sie sind für die Kompatibilität von Komponenten essenziell.",
            source: "LF 2, Kap. 2.3.1" },
          { type: "mc", q: "Welche Aussage zum Verhältnis von Datenschutz und Datensicherheit ist korrekt?",
            options: [
              "Beide Begriffe sind synonym und beschreiben dieselbe Sache",
              "Datenschutz bezieht sich auf personenbezogene Daten, Datensicherheit auf den Schutz aller Daten unabhängig vom Personenbezug",
              "Datenschutz gilt nur digital, Datensicherheit nur analog",
              "Datenschutz wird vom BSI geregelt, Datensicherheit vom Datenschutzbeauftragten"
            ],
            correct: 1,
            explain: "Datenschutz schützt die privaten, personenbezogenen Daten - Recht auf informationelle Selbstbestimmung (BDSG, DSGVO). Datensicherheit dagegen ist umfassender: Schutz ALLER Daten im Unternehmen, mit oder ohne Personenbezug, digital oder analog. Zuständig für Datensicherheit ist u.a. das BSI.",
            source: "LF 2, Kap. 2.3.3, 2.3.4" }
        ]
      },
      "2.4": {
        title: "Komponenten eines Arbeitsplatzcomputers unterscheiden",
        questions: [
          { type: "mc", q: "Welche Aussage zum Arbeitsspeicher (RAM) ist korrekt?",
            options: ["Der RAM behält seinen Inhalt auch nach dem Ausschalten des Computers.","Der RAM ist ein flüchtiger Speicher und verliert seinen Inhalt beim Ausschalten.","Der RAM dient zur dauerhaften Speicherung des Betriebssystems.","Der RAM ersetzt vollständig die Festplatte."],
            correct: 1,
            explain: "RAM (Random Access Memory) ist ein flüchtiger Speicher - alle Daten werden beim Ausschalten gelöscht. Während des Betriebs hält der RAM Programme und Daten bereit, auf die die CPU direkt zugreifen kann. Im Gegensatz dazu speichert das ROM auf dem Mainboard das BIOS/UEFI dauerhaft.",
            source: "LF 2, Kap. 2.4.1" },
          { type: "fill", q: "Wie heißt das Basisprogramm auf dem Mainboard, das den Startvorgang des Computers ausführt und das Betriebssystem von der Festplatte lädt? (heute meist als UEFI bezeichnet)",
            answers: ["BIOS", "Basic Input Output System", "Basic-Input-Output-System"],
            explain: "Das BIOS (Basic Input Output System) ist auf einem ROM-Chip des Mainboards gespeichert und führt den Startvorgang aus. Es ruft das eigentliche Betriebssystem von der Festplatte auf. Heute wird BIOS überwiegend durch UEFI ersetzt, das mehr Funktionen und höhere Sicherheit bietet.",
            source: "LF 2, Kap. 2.4.1" },
          { type: "tf", q: "DDR4-RAM-Module sind abwärtskompatibel und können in Mainboards eingesetzt werden, die für DDR3-RAM ausgelegt sind.",
            correct: false,
            explain: "Falsch. Die verschiedenen DDR-Generationen sind untereinander nicht kompatibel. DDR4 passt weder physikalisch noch elektrisch in DDR3-Slots. Beim Aufrüsten muss daher genau geprüft werden, welche RAM-Generation das Mainboard unterstützt.",
            source: "LF 2, Kap. 2.4.1" },
          { type: "mc", q: "Welche Festplattentechnologie ist energieeffizienter, deutlich schneller bei Bootvorgängen und Datentransfer, aber pro GB teurer als die ältere Alternative?",
            options: ["HDD (Hard Disk Drive)","SSD (Solid State Drive)","eMMC (embedded Multimedia Card)","Magnetband-Speicher"],
            correct: 1,
            explain: "SSDs nutzen Flash-Speicher ohne bewegliche Teile - daher leise, schneller Datentransfer, schnelles Booten und geringerer Energieverbrauch. Nachteil: höherer Preis pro GB im Vergleich zur klassischen HDD. Aus energetischen Gründen sind SSDs vorzuziehen.",
            source: "LF 2, Kap. 2.4.3" },
          { type: "multi", q: "Welche der folgenden Komponenten gehören zur Zentraleinheit eines Computers im engeren Sinne? (Mehrfachauswahl)",
            options: ["CPU (Prozessor)","Tastatur","Arbeitsspeicher (RAM)","Mainboard mit Chipsatz","Monitor"],
            correct: [0, 2, 3],
            explain: "Die Zentraleinheit umfasst Mainboard, CPU und Arbeitsspeicher - alles, was zur direkten Datenverarbeitung gehört. Tastatur und Monitor sind Peripheriegeräte (für Eingabe bzw. Ausgabe), gehören also nicht zur Zentraleinheit.",
            source: "LF 2, Kap. 2.4.1" },
          { type: "mc", q: "Welche Prozessor-Reihe von Intel ist speziell für leistungsstarke Workstations und Server konzipiert (mit Performance-Stufen Bronze, Silver, Gold und Platinum)?",
            options: ["Intel Core i9","Intel Core i7","Intel Xeon","Intel Pentium"],
            correct: 2,
            explain: "Intel Xeon-Prozessoren sind für Workstations und Server ausgelegt - mit den Performance-Stufen Bronze, Silver, Gold und Platinum. Sie bieten mehr Cache, mehr Cores, ECC-Speicher-Unterstützung und höhere Zuverlässigkeit. Das AMD-Pendant für diesen Bereich ist der Ryzen Threadripper bzw. EPYC.",
            source: "LF 2, Kap. 2.4.1" },
          { type: "multi", q: "Welche der folgenden Speichertypen sind nichtflüchtig (behalten Daten ohne Stromversorgung)? (Mehrfachauswahl)",
            options: ["RAM (DDR4)","SSD","HDD","Cache-Speicher der CPU","ROM (mit BIOS/UEFI)"],
            correct: [1, 2, 4],
            explain: "Nichtflüchtig sind SSD und HDD (Massenspeicher) sowie das ROM mit dem BIOS/UEFI. RAM und der CPU-Cache sind flüchtige Speicher - sie verlieren ihren Inhalt beim Ausschalten.",
            source: "LF 2, Kap. 2.4.1, 2.4.3" },
          { type: "tf", q: "Single-Core-Prozessoren sind für anspruchsvolle Anwendungen wie 3D-Rendering, CAD und professionelle Videobearbeitung ausreichend.",
            correct: false,
            explain: "Falsch. Single-Core-Prozessoren reichen für Standardanwendungen (Office, Kommunikation, einfache Bildbearbeitung). Für 3D-Rendering, CAD, Videobearbeitung und professionelle Audio-/Bildbearbeitung sind Multi-Core-Prozessoren notwendig, da diese Anwendungen die Last auf mehrere Kerne verteilen können.",
            source: "LF 2, Kap. 2.4.1" },
          { type: "mc", q: "Welche Komponente auf dem Mainboard sorgt für die Kommunikation zwischen allen Hardware-Komponenten und bestimmt maßgeblich die Ausstattung und Leistung des Mainboards?",
            options: ["Die CPU (der Prozessor)","Das BIOS","Der Chipsatz","Der RAM-Slot"],
            correct: 2,
            explain: "Der Chipsatz organisiert über seine Controller den Datenverkehr zwischen CPU, RAM, Festplatten und Peripherie. Beim Mainboard-Kauf ist die Kompatibilität von Chipsatz, Prozessor und Sockel entscheidend - sie bestimmt, welche CPUs überhaupt eingesetzt werden können.",
            source: "LF 2, Kap. 2.4.1" },
          { type: "fill", q: "Welche RAM-Variante korrigiert Speicherfehler selbstständig und wird daher häufig in Servern und hochwertigen Workstations eingesetzt? (Abkürzung)",
            answers: ["ECC", "ECC-RAM", "ECC RAM"],
            explain: "ECC (Error Correcting Code) RAM kann Speicherfehler erkennen und korrigieren. In gängigen Desktop-PCs und Notebooks wird unbuffered, unregistered RAM ohne ECC verwendet. Server und Workstations setzen auf das teurere \"fully buffered, registered ECC RAM\", um Datenintegrität sicherzustellen.",
            source: "LF 2, Kap. 2.4.1" }
        ]
      },
      "2.5": {
        title: "Kundenanforderungen und Projektmanagement",
        questions: [
          { type: "mc", q: "Welches Dokument wird vom Auftraggeber erstellt und beschreibt die Anforderungen mit den Fragen \"Was?\" und \"Wofür?\"?",
            options: ["Pflichtenheft","Lastenheft","Werkvertrag","Sollkonzept"],
            correct: 1,
            explain: "Das Lastenheft (User Specification) wird vom Auftraggeber/Kunden erstellt und beschreibt die Gesamtheit der Forderungen - das Was und Wofür. Es ist allgemein verständlich und ergebnisorientiert. Das Pflichtenheft erstellt der Auftragnehmer als Antwort darauf (Wie und Womit).",
            source: "LF 2, Kap. 2.5.3" },
          { type: "mc", q: "Wer erstellt das Pflichtenheft und welche Fragen beantwortet es?",
            options: ["Der Auftraggeber - es beantwortet \"Was?\" und \"Wofür?\"","Der Auftragnehmer - es beantwortet \"Wie?\" und \"Womit?\"","Eine externe Zertifizierungsstelle - es beantwortet \"Wann?\" und \"Wo?\"","Der Projektmanager des Kunden - es beantwortet \"Wer?\" und \"Warum?\""],
            correct: 1,
            explain: "Das Pflichtenheft (Functional Specification) wird vom Auftragnehmer auf Basis des Lastenhefts erstellt. Es enthält die konkreten Realisierungsvorgaben - das Wie und Womit - und ist Grundlage für den Kundenvertrag und den späteren Abnahmekatalog.",
            source: "LF 2, Kap. 2.5.3" },
          { type: "fill", q: "In welcher DIN-Norm zum Projektmanagement sind die Begriffe Lasten- und Pflichtenheft definiert?",
            answers: ["DIN 69901-5", "DIN 69901", "DIN 69905"],
            explain: "Die DIN 69901-5 (Projektmanagement, Begriffe) definiert Lasten- und Pflichtenheft. Wichtig: Die Norm legt die Begriffe fest, nicht aber die konkrete Gliederung oder die Inhalte - jedes Unternehmen hat hier seinen eigenen Standard.",
            source: "LF 2, Kap. 2.5.3" },
          { type: "mc", q: "Welche Vertragsart liegt vor, wenn ein Systemhaus IT-Hardware an einen Kunden liefert und das Eigentum übergeht?",
            options: ["Werkvertrag","Dienstleistungsvertrag","Kaufvertrag","Mietvertrag"],
            correct: 2,
            explain: "Der Kaufvertrag regelt die Übergabe von Eigentum gegen Bezahlung. Im IT-Bereich kommen außerdem der Werkvertrag (geschuldet wird ein konkretes Werk/Ergebnis, z.B. eine fertige Konfiguration) und der Dienstleistungsvertrag (geschuldet wird die Tätigkeit, nicht der Erfolg, z.B. Beratung, Support) zum Einsatz.",
            source: "LF 2, Kap. 2.5, 2.9.4" },
          { type: "mc", q: "Welche Kriterien werden in einem Lastenheft typischerweise unterschieden, um die Wichtigkeit von Anforderungen zu strukturieren?",
            options: ["A-, B- und C-Kriterien","Muss-, Kann- und Abgrenzungskriterien","Soll-, Wunsch- und Verbots-Kriterien","Prio-1-, Prio-2- und Prio-3-Kriterien"],
            correct: 1,
            explain: "Funktionale Anforderungen werden im Lastenheft typischerweise in Muss-Kriterien (zwingend), Kann-Kriterien (optional/Wunsch) und Abgrenzungskriterien (was ausdrücklich nicht zum Lieferumfang gehört) unterteilt. So lassen sich Prioritäten klar kommunizieren.",
            source: "LF 2, Kap. 2.5.3" },
          { type: "fill", q: "Welches Akronym beschreibt eine Methode zur Zielformulierung mit den Eigenschaften Spezifisch, Messbar, Akzeptiert, Realistisch und Terminiert?",
            answers: ["SMART"],
            explain: "Die SMART-Methode hilft, Ziele präzise zu formulieren: Spezifisch (eindeutig), Messbar (mit Kennzahlen), Akzeptiert (von allen Beteiligten), Realistisch (machbar), Terminiert (mit Frist). Besonders im Pflichtenheft sollten Ziele SMART formuliert sein, um spätere Abnahmen zu erleichtern.",
            source: "LF 2, Kap. 2.5.3" },
          { type: "mc", q: "Welche Anforderungstypen werden bei der Anforderungsanalyse üblicherweise unterschieden?",
            options: ["Externe und interne Anforderungen","Funktionale und nicht funktionale Anforderungen","Hardware- und Software-Anforderungen","Schriftliche und mündliche Anforderungen"],
            correct: 1,
            explain: "Funktionale Anforderungen beschreiben, WAS das System leisten soll (z.B. Druck, Datenexport). Nicht funktionale Anforderungen beschreiben, WIE es geleistet werden soll (z.B. Performance, Sicherheit, Verfügbarkeit, Benutzbarkeit, rechtliche/kulturelle/normative Vorgaben).",
            source: "LF 2, Kap. 2.5.3, LF 5" },
          { type: "multi", q: "Welche der folgenden Punkte gehören typischerweise in ein Lastenheft? (Mehrfachauswahl)",
            options: ["Ausgangssituation und Zielsetzung","Funktionale Anforderungen (Muss-/Kann-/Abgrenzungskriterien)","Detaillierter Programmcode der Lösung","Lieferumfang","Abnahmekriterien"],
            correct: [0, 1, 3, 4],
            explain: "Typische Lastenheft-Bestandteile: Ausgangssituation/Zielsetzung, funktionale Anforderungen, nicht funktionale Anforderungen, Lebenszyklus des Gesamtsystems, Lieferumfang und Abnahmekriterien. Programmcode oder technische Lösungsdetails gehören NICHT ins Lastenheft - das würde die Lösungsfreiheit des Auftragnehmers einschränken.",
            source: "LF 2, Kap. 2.5.3" },
          { type: "mc", q: "Welche Aussage beschreibt die typische Reihenfolge im idealtypischen Ablauf bis zum Projektbeginn am besten?",
            options: ["Pflichtenheft (Auftraggeber) → Lastenheft (Auftragnehmer) → Vertrag","Lastenheft (Auftraggeber) → Pflichtenheft (Auftragnehmer) → Vertrag → Projektstart","Vertrag → Lastenheft → Pflichtenheft → Projektstart","Angebot → Bestellung → Lastenheft → Pflichtenheft"],
            correct: 1,
            explain: "Idealtypischer Ablauf: Auftraggeber erstellt das Lastenheft → übergibt es an den Auftragnehmer → dieser erstellt auf Basis des Lastenhefts das Pflichtenheft → Pflichtenheft wird Grundlage des Vertrags → nach Vertragsunterzeichnung startet das Projekt. Das Pflichtenheft kann während des Projekts noch ergänzt werden.",
            source: "LF 2, Kap. 2.5.3" },
          { type: "fill", q: "Wie heißt nach DIN 69901 ein Einzelvorhaben mit definierbarem Anfang und Ende, das im Wesentlichen durch die Einmaligkeit der Bedingungen gekennzeichnet ist (z.B. Ziele, Zeit, Ressourcen, Projektorganisation)?",
            answers: ["Projekt"],
            explain: "Nach DIN 69901 ist ein Projekt ein Einzelvorhaben mit definierbarem Anfang und Ende, gekennzeichnet durch die Einmaligkeit der Rahmenbedingungen - Zielvorgaben, zeitliche/finanzielle/personelle/organisatorische Aspekte. Typisch ist eine eigene Projektorganisation mit Teammitgliedern aus unterschiedlichen Fachbereichen.",
            source: "LF 2, Kap. 2.5.4" },
          { type: "mc", q: "Was bezeichnet ein Meilenstein im Projektmanagement nach DIN 69900?",
            options: [
              "Eine Routineaufgabe, die täglich wiederholt wird",
              "Ein Ereignis besonderer Bedeutung, in der Regel die Fertigstellung eines Projektabschnitts oder Teilprojekts",
              "Eine einzelne Stunde Arbeitsaufwand",
              "Die finale Rechnung an den Auftraggeber"
            ],
            correct: 1,
            explain: "Nach DIN 69900 ist ein Meilenstein ein \"Ereignis besonderer Bedeutung\", typischerweise die Fertigstellung eines Projektabschnitts oder Teilprojekts. Als Handlungsprodukte können Präsentationen, Abnahmeprotokolle oder Gutachten dienen. Ein Meilenstein ist immer auch ein Termin, an dem über die Fortsetzung oder den Abbruch des Projekts entschieden werden kann.",
            source: "LF 2, Kap. 2.5.4" },
          { type: "tf", q: "Im Projektmanagement sollten nachträgliche Änderungen am Projektauftrag möglichst vermieden werden, um Termine und Kosten kalkulierbar zu halten.",
            correct: true,
            explain: "Korrekt. Zu den Grundsätzen erfolgreichen Projektmanagements gehört: der Projektauftrag muss klare (SMART-)Ziele angeben, und nachträgliche Änderungen sollten möglichst vermieden werden. Häufige Änderungen gefährden Zeitplan, Budget und Qualität - das sogenannte magische Dreieck des Projektmanagements.",
            source: "LF 2, Kap. 2.5.4" },
          { type: "multi", q: "Welche der folgenden Punkte gelten laut Lehrbuch als Erfolgsfaktoren guten Projektmanagements? (Mehrfachauswahl)",
            options: [
              "Klar verteilte Rollen im Team",
              "Möglichst homogene Zusammensetzung des Teams",
              "Mindestens einige projekterfahrene Mitarbeiter",
              "Akzeptanz und Durchsetzungskraft des Projektleiters",
              "Unterstützung durch Vorgesetzte und Auftraggeber"
            ],
            correct: [0, 2, 3, 4],
            explain: "Erfolgsfaktoren: klare Rollenverteilung, projekterfahrene Mitarbeiter im Team, akzeptierter Projektleiter, Unterstützung durch Auftraggeber. Wichtig ist außerdem, dass das Team gerade NICHT zu homogen ist - verschiedene Teamtypen und Teilkompetenzen ergänzen sich besser.",
            source: "LF 2, Kap. 2.5.4" },
          { type: "mc", q: "Welche Phase folgt im Beschaffungs- und Bereitstellungsablauf typischerweise UNMITTELBAR auf die Anforderungsanalyse?",
            options: [
              "Abnahme und Übergabe",
              "Angebot bis Auftragsbestätigung",
              "Wartung und Support",
              "Schulung der Mitarbeiter"
            ],
            correct: 1,
            explain: "Typischer Ablauf laut Netzplanbeispiel: Anforderungsanalyse → Angebot bis Auftragsbestätigung → Bestellung der Hard-/Software → Anlieferung und Vorinstallation → Komponenten montieren → System lauffähig einrichten → Abnahme. Schulung und Support folgen erst nach erfolgreicher Inbetriebnahme.",
            source: "LF 2, Kap. 2.5.4" }
        ]
      },
      "2.6": {
        title: "Marktgängige IT-Systeme vorstellen",
        questions: [
          { type: "mc", q: "Was unterscheidet einen Fat Client (Thick Client) von einem Thin Client?",
            options: [
              "Fat Clients besitzen kein eigenes Betriebssystem, Thin Clients schon.",
              "Fat Clients verarbeiten Programme und Daten lokal, Thin Clients lassen das Meiste vom Server erledigen.",
              "Fat Clients sind grundsätzlich mobile Geräte, Thin Clients stationär.",
              "Fat Clients haben kein Display, Thin Clients schon."
            ],
            correct: 1,
            explain: "Bei Fat Clients (Desktops, Workstations) werden Programme und Daten im Wesentlichen auf dem Client-Rechner verarbeitet. Bei Thin Clients erfolgt die Verarbeitung in der Regel auf dem Server - der Client bleibt schlank und dient vor allem der Ein- und Ausgabe.",
            source: "LF 2, Kap. 2.6" },
          { type: "fill", q: "Wie nennt man einen ausbaufähigen Basisrechner, bei dem Netzteil, Mainboard, Kabel und Kühlsystem bereits in einem Gehäuse vormontiert sind, weitere Komponenten aber selbst ergänzt werden?",
            answers: ["Barebone", "Barebone-Rechner", "Barebone PC"],
            explain: "Ein Barebone (englisch \"blanker Knochen\") liefert die Grundausstattung in einem Gehäuse. CPU, RAM, Festplatten und ggf. Grafikkarte werden je nach Bedarf ergänzt. Geeignet für Arbeitsplätze mit hohen oder speziellen Leistungsanforderungen sowie für Mini-PC-Lösungen.",
            source: "LF 2, Kap. 2.6" },
          { type: "tf", q: "Ein Zero Client besitzt im Gegensatz zum klassischen Thin Client keinen lokalen Anwenderspeicher und ist vollständig vom Server abhängig.",
            correct: true,
            explain: "Korrekt. Der Zero Client ist eine besonders schlanke Form des Thin Clients - ohne lokalen Anwenderspeicher, vollständig abhängig vom Server. Nachteile: Offline-Betrieb nicht möglich, Latenzzeiten durch Netzbelastung. Vorteile: minimaler Administrationsaufwand, geringer Energieverbrauch.",
            source: "LF 2, Kap. 2.6" },
          { type: "mc", q: "Welche Bauform ist typisch für einen leistungsstarken Arbeitsplatzcomputer für technisch-wissenschaftliche Zwecke oder Multimedia-Bearbeitung, oft mit vielen Kernen und mehr als 8 GB RAM?",
            options: [
              "All-in-One-PC",
              "Workstation",
              "Stick-PC",
              "Zero Client"
            ],
            correct: 1,
            explain: "Die Workstation (deutsch: Arbeitsstation) ist ein leistungsfähiger Arbeitsplatzrechner für technisch-wissenschaftliche oder multimediale Aufgaben. Typische Merkmale: viele Kerne, hoch getaktet, mehr als 8 GB RAM, oft mit zertifizierten Komponenten (z.B. Xeon-CPUs, ECC-RAM, dedizierte Grafikkarte).",
            source: "LF 2, Kap. 2.6" },
          { type: "multi", q: "Welche der folgenden Aussagen über Thin Clients treffen zu? (Mehrfachauswahl)",
            options: [
              "Daten werden bevorzugt zentral auf Servern abgelegt.",
              "Wartungskosten sind in der Regel höher als bei Fat Clients.",
              "Auch ältere Geräte lassen sich als Thin Clients weiternutzen.",
              "Sie eignen sich gut für Green-IT-Konzepte.",
              "Sie funktionieren ohne Netzanbindung uneingeschränkt."
            ],
            correct: [0, 2, 3],
            explain: "Thin Clients legen Daten zentral ab (besserer Datenschutz und -sicherheit), erlauben die Weiternutzung von Altgeräten, und sind durch geringen Energieverbrauch grün. Falsch ist hingegen: Wartungskosten sind niedriger, nicht höher; ohne Netz sind sie eingeschränkt nutzbar.",
            source: "LF 2, Kap. 2.6" },
          { type: "mc", q: "Welche Aussage zu All-in-One-PCs ist korrekt?",
            options: [
              "Der Rechner ist physisch von Monitor und Eingabegeräten getrennt.",
              "Der Rechner ist im Monitorgehäuse untergebracht, die Monitore sind daher meist größer (ca. 21-27 Zoll).",
              "All-in-One-PCs sind grundsätzlich Thin Clients.",
              "Sie können keine Touchscreens haben."
            ],
            correct: 1,
            explain: "Beim All-in-One-PC ist der Rechner im Monitorgehäuse verbaut. Dadurch sind die Monitore in der Regel größer (21-27 Zoll), häufig auch mit Touchscreen ausgestattet - etwa für die Nutzung als Infopoint oder durch wechselnde Anwender.",
            source: "LF 2, Kap. 2.6" },
          { type: "fill", q: "Wie heißt das Konzept eines sehr kleinen, portablen Rechners im Stiftformat, der oft mit portablem Betriebssystem und portablen Apps flexibel an Bildschirme angeschlossen werden kann?",
            answers: ["Stick-PC", "Stick PC", "StickPC"],
            explain: "Stick-PCs sind besonders kompakte Mini-Computer, die mit portablem Betriebssystem und Apps flexibel überall einen eigenen Rechner mit Anwendungen bieten können. Typisch werden sie an einen HDMI-Eingang eines Monitors gesteckt.",
            source: "LF 2, Kap. 2.6" },
          { type: "mc", q: "Welche Geräte zählen laut Lehrbuch zur Kategorie der Smart Devices am Arbeitsplatz?",
            options: [
              "Tower-PCs und Workstations",
              "Mainframe-Computer und Supercomputer",
              "Kleinst-Computer, die vernetzt mit IT-Systemen interagieren (z.B. Smartphones, Smart-Home-Geräte, Komponenten in Smart Factories)",
              "Ausschließlich klassische Desktop-PCs"
            ],
            correct: 2,
            explain: "Smart Devices sind digital vernetzte Einheiten - Kleinst-Computer, die in Maschinen, Werkzeugen und Anlagen eingebaut sind und vernetzt mit Computersystemen interagieren. Beispiele: Smartphones, Smart-Home-Anwendungen, Komponenten in Smart Factories.",
            source: "LF 2, Kap. 2.6" },
          { type: "tf", q: "Ein Embedded System ist ein eigenständiger Arbeitsplatzcomputer, der typischerweise als Tower-PC im Büro eingesetzt wird.",
            correct: false,
            explain: "Falsch. Embedded Systems sind in Maschinen, Anlagen oder Erzeugnisse eingebettete IT-Systeme - sie sind genau das Gegenteil eines eigenständigen Arbeitsplatzcomputers. Beispiele: Steuerungselektronik in Fahrzeugen, Industriemaschinen oder Haushaltsgeräten.",
            source: "LF 2, Kap. 2.6" },
          { type: "mc", q: "Welche der folgenden Größen zählt zu den quantitativen (messbaren, objektiven) Auswahlkriterien für IT-Hardware?",
            options: [
              "Design",
              "Robustheit",
              "Energieverbrauch und Geschwindigkeit",
              "Erweiterbarkeit und Kompatibilität"
            ],
            correct: 2,
            explain: "Quantitative Größen sind objektiv messbar: Volumen, Kapazität, Gewicht, Energie, Geräuschentwicklung, Temperatur, Schnelligkeit, Performance, Stabilität. Qualitative Größen wie Design, Robustheit, Kompatibilität und Erweiterbarkeit sind schwerer zu messen und oft subjektiv zu bewerten.",
            source: "LF 2, Kap. 2.6" }
        ]
      },
      "2.7": {
        title: "Konfiguration und Installation",
        questions: [
          { type: "mc", q: "Was beschreibt der Begriff \"Customizing\" im Zusammenhang mit Standardsoftware?",
            options: [
              "Die komplette Neuentwicklung einer Software als Individualsoftware",
              "Das Anpassen von Standardsoftware an die individuellen Wünsche des Kunden, ohne den Quellcode zu verändern",
              "Das Übersetzen einer Software in eine andere Programmiersprache",
              "Das Übertragen von Daten aus einem Altsystem in ein neues System"
            ],
            correct: 1,
            explain: "Customizing ist das Anpassen von Standardsoftware an Kundenwünsche, ohne den Quellcode anzufassen. Üblich sind zwei Wege: Konfiguration (Auswahl und Zusammenstellung von Modulen) und Parametrisierung (Aktivieren/Deaktivieren von Funktionen über Parameter).",
            source: "LF 2, Kap. 2.7" },
          { type: "fill", q: "Wie nennt man die Anpassung einer Standardsoftware durch das Setzen von Parametern, mit denen Teile des Programms aktiviert oder deaktiviert werden?",
            answers: ["Parametrisierung", "Parametrierung"],
            explain: "Bei der Parametrisierung wird die Software über Parameter auf den benötigten Funktionsumfang angepasst - Teile der Standardsoftware werden aktiviert oder deaktiviert. Sie ist neben der Konfiguration die zweite klassische Customizing-Variante.",
            source: "LF 2, Kap. 2.7" },
          { type: "tf", q: "Wenn das Customizing einer Standardsoftware nicht ausreicht, ist die Erweiterungsprogrammierung über definierte Schnittstellen die nächste Stufe, bevor eine komplette Neuentwicklung als Individualsoftware in Betracht gezogen wird.",
            correct: true,
            explain: "Korrekt. Die Stufen lauten: Customizing (Konfiguration/Parametrisierung) → Erweiterungsprogrammierung (individuelle Programmteile über definierte Schnittstellen) → Individualsoftware (komplette Neuentwicklung). Erst wenn die jeweils einfachere Stufe nicht reicht, geht man zur nächsten über.",
            source: "LF 2, Kap. 2.7" },
          { type: "mc", q: "Welche Reihenfolge beschreibt den typischen Ablauf bei der Bereitstellung eines neuen Arbeitsplatz-Clients (vereinfacht)?",
            options: [
              "Anschluss → Anforderungsanalyse → Beschaffung → Einweisung",
              "Anforderungsanalyse → Beschaffung → Konfiguration → Installation → Einweisung und Abnahme",
              "Installation → Beschaffung → Anforderungsanalyse → Abnahme",
              "Einweisung → Konfiguration → Beschaffung → Installation"
            ],
            correct: 1,
            explain: "Die typische Abfolge im Leistungsprozess: zuerst Anforderungsanalyse beim Kunden, dann Beschaffung der passenden Komponenten, anschließend Konfiguration und Installation (Betriebssystem, Anwendersoftware, Anpassung der Oberfläche), zum Schluss Einweisung der Anwender und formale Abnahme.",
            source: "LF 2, Kap. 2.7" },
          { type: "multi", q: "Welche Schritte gehören zum physischen (Hardware-)Anschluss eines neuen Clients im Netzwerk? (Mehrfachauswahl)",
            options: [
              "Prüfen, ob die Anschlussdose vorhanden und die richtige Kategorie hat",
              "Konfiguration der Benutzeroberfläche an die Kundenwünsche anpassen",
              "Freien Switchport im Verteiler suchen",
              "Patchverbindung zwischen Switchport und Anschlussbuchse herstellen",
              "Druckertreiber installieren"
            ],
            correct: [0, 2, 3],
            explain: "Der Hardwareanschluss umfasst: Anschlussdose und deren Kategorie prüfen, Verteiler/Buchse lokalisieren, freien Switchport suchen, Verbindungsschnüre prüfen und patchen (Rechner → Dose, Switchport → Buchse). GUI-Anpassung und Druckertreiber gehören zur nachgelagerten Software- bzw. Inbetriebnahme-Phase.",
            source: "LF 2, Kap. 2.7" },
          { type: "mc", q: "Wie beziehen Clients in einem ordentlich eingerichteten Netzwerk üblicherweise ihre IP-Adresse?",
            options: [
              "Manuell per Hand vom Administrator eingetragen, da das zuverlässiger ist",
              "Automatisch über einen DHCP-Server, der einen Pool von IP-Adressen verwaltet",
              "Über das BIOS des Clients",
              "Vom Drucker, der die IP-Adressen verteilt"
            ],
            correct: 1,
            explain: "Manuelle Einstellungen sind zu fehleranfällig und werden vermieden. Beim Einrichten eines Netzwerks wird ein DHCP-Server eingerichtet, der die IP-Adressen aus einem Pool automatisch an die angeschlossenen Rechner verteilt.",
            source: "LF 2, Kap. 2.7" },
          { type: "fill", q: "Welcher Konsolenbefehl zeigt unter Windows die aktuelle IP-Konfiguration des Rechners an?",
            answers: ["ipconfig", "ipconfig /all"],
            explain: "Mit \"ipconfig\" in der Eingabeaufforderung erhält man einen kurzen Überblick über die IP-Einstellungen. Mit dem Parameter \"/all\" werden alle Details ausgegeben (MAC, DNS-Server, DHCP-Lease usw.). Verändern lässt sich die Konfiguration mit ipconfig nicht - dafür braucht es die grafische Oberfläche oder andere Tools.",
            source: "LF 2, Kap. 2.7" },
          { type: "mc", q: "Welche Tests gehören zur Inbetriebnahme eines neu eingebundenen Clients dazu?",
            options: [
              "Nur ein Reboot des Rechners",
              "Ping auf eine Internetseite, Prüfung der Namensauflösung (DNS), Erreichbarkeit von Router und Internet",
              "Ausschließlich das Öffnen eines Browsers",
              "Eine reine Sichtprüfung der LED-Anzeigen am Switch"
            ],
            correct: 1,
            explain: "Zur sauberen Inbetriebnahme gehört: Ping auf eine Internetseite, Prüfung der DNS-Namensauflösung, Erreichbarkeit des Routers, Zugang zum Internet. Anschließend werden Rechnername, Anschlussdosen-Nummer, IP-Adresse und Betriebssystem dokumentiert.",
            source: "LF 2, Kap. 2.7" },
          { type: "tf", q: "Bei der Datenmigration wird ein vorhandenes System zur Verwaltung von Daten durch ein neues ersetzt, wobei die Daten vom Altsystem auf das neue System übertragen werden müssen.",
            correct: true,
            explain: "Korrekt. Datenmigration bedeutet: Altsystem wird abgelöst, die enthaltenen Daten müssen ins neue System überführt werden. Häufige Herausforderungen dabei: unterschiedliche Datenformate, Datenbereinigung, Vollständigkeit der Übernahme und Validierung nach dem Transfer.",
            source: "LF 2, Kap. 2.7" },
          { type: "mc", q: "Was unterscheidet die Anpassung von Individualsoftware grundsätzlich von der Anpassung einer Standardsoftware?",
            options: [
              "Individualsoftware kann nur vom Hersteller verändert werden, Standardsoftware nur vom Kunden",
              "Bei Individualsoftware wird in der Regel der Quellcode verändert; bei Standardsoftware erfolgt die Anpassung üblicherweise über Customizing (Konfiguration und Parametrisierung)",
              "Standardsoftware ist immer kostenfrei, Individualsoftware kostenpflichtig",
              "Individualsoftware lässt sich grundsätzlich nicht mehr anpassen, sobald sie ausgeliefert wurde"
            ],
            correct: 1,
            explain: "Bei Individualsoftware wird typischerweise der Quellcode geändert - flexible Anpassung, allerdings mit Aufwand. Bei Standardsoftware bleibt der Quellcode unverändert; Anpassungen laufen über Customizing (Konfiguration, Parametrisierung) und ggf. Erweiterungsprogrammierung über definierte Schnittstellen.",
            source: "LF 2, Kap. 2.7" }
        ]
      },
      "2.8": {
        title: "Beschaffungsprozess und Kalkulation",
        questions: [
          { type: "fill", q: "Wie heißt die Methode, mit der Artikel anhand ihres Wertanteils am Lagerbestand in drei Kategorien eingeteilt werden - typischerweise hochpreisige Hauptartikel, mittlere und geringwertige Artikel?",
            answers: ["ABC-Analyse", "ABC Analyse"],
            explain: "Die ABC-Analyse teilt Artikel nach Wertanteil ein: A-Artikel (hoher Wertanteil, wenige Stück - z.B. Server, intensive Beschaffung), B-Artikel (mittlerer Wertanteil - z.B. PCs, Notebooks), C-Artikel (geringer Wertanteil, viele Stück - z.B. USB-Sticks, vereinfachte Beschaffung). Bei A- und B-Artikeln lohnt sich intensives Lieferantenmanagement.",
            source: "LF 2, Kap. 2.9.1" },
          { type: "mc", q: "Welche der folgenden Aussagen beschreibt eine \"Anpreisung\" im rechtlichen Sinne korrekt?",
            options: [
              "Ein rechtlich verbindliches Angebot an einen konkreten Adressaten",
              "Ein unverlangtes, unverbindliches Angebot an die Allgemeinheit (z.B. Inserat, Plakat)",
              "Eine schriftliche Bestellung des Kunden",
              "Eine Auftragsbestätigung des Verkäufers"
            ],
            correct: 1,
            explain: "Eine Anpreisung ist ein unverlangtes Angebot, das sich nicht an eine konkrete Person richtet (z.B. Inserate, Schaufenster, Plakate). Sie ist rechtlich unverbindlich - eine Bestellung darauf muss nicht zum Kaufvertrag führen. Das Gesetz gegen den unlauteren Wettbewerb (UWG) ist zu beachten.",
            source: "LF 2, Kap. 2.8" },
          { type: "tf", q: "Eine Anfrage des Kunden ist rechtlich verbindlich und verpflichtet den Lieferanten zur Annahme.",
            correct: false,
            explain: "Falsch. Die Anfrage ist rechtlich unverbindlich. Sie dient zur Geschäftsanbahnung und fordert den Lieferanten lediglich auf, ein Angebot abzugeben (verlangtes Angebot). Erst Angebot und Bestellung führen ggf. zum Vertragsabschluss.",
            source: "LF 2, Kap. 2.8" },
          { type: "mc", q: "Welche Formulierung kennzeichnet ein unverbindliches Angebot durch sogenannte Freizeichnungsklauseln?",
            options: [
              "\"Festpreis, gültig bis zum Vertragsschluss\"",
              "\"Lieferung garantiert innerhalb von 7 Tagen\"",
              "\"Freibleibend\", \"Zwischenverkauf vorbehalten\", \"solange der Vorrat reicht\"",
              "\"Bindefrist 30 Tage\""
            ],
            correct: 2,
            explain: "Freizeichnungsklauseln machen ein Angebot unverbindlich. Typische Formulierungen: \"freibleibend\", \"ohne Gewähr\", \"solange der Vorrat reicht\", \"Preis freibleibend\", \"Zwischenverkauf vorbehalten\", \"Druckfehler und Irrtum vorbehalten\". Fehlen solche Klauseln, ist der Anbieter innerhalb bestimmter Fristen an das Angebot gebunden.",
            source: "LF 2, Kap. 2.8" },
          { type: "fill", q: "Wie nennt man die zweiseitige Willenserklärung, die durch übereinstimmende Erklärungen von Käufer und Verkäufer zustande kommt und beide zur Erfüllung verpflichtet?",
            answers: ["Kaufvertrag"],
            explain: "Ein Kaufvertrag entsteht durch zwei übereinstimmende Willenserklärungen - z.B. Angebot des Verkäufers und Bestellung des Kunden ohne Änderungen, oder Bestellung des Kunden und passende Auftragsbestätigung. Mit dem Vertragsabschluss gehen beide Parteien ein Verpflichtungsgeschäft ein. Schriftform ist nach BGB nicht vorgeschrieben, in der Praxis aber dringend zu empfehlen.",
            source: "LF 2, Kap. 2.8" },
          { type: "multi", q: "Welche Fragen sollten vor Annahme eines Auftrags zur Prüfung der Realisierbarkeit beantwortet werden? (Mehrfachauswahl)",
            options: [
              "Ist die nachgefragte Menge bis zur Lieferfrist lieferbar?",
              "Sind Personal und Ressourcen für die Abwicklung vorhanden?",
              "Wie ist die Bonität des Kunden?",
              "Welche Farbe hat das Firmenlogo des Kunden?",
              "Sind die Preiserwartungen des Kunden erfüllbar?"
            ],
            correct: [0, 1, 2, 4],
            explain: "Die Realisierbarkeitsprüfung umfasst Lieferfähigkeit (Menge, Personal, Ressourcen) und Lieferwilligkeit (Bonität des Kunden, Liquidität des eigenen Unternehmens, Erfüllbarkeit der Konditionen). Ein zu großer Auftrag kann ein Unternehmen sonst schnell in Liquiditätsprobleme bringen.",
            source: "LF 2, Kap. 2.8" },
          { type: "mc", q: "Was bezeichnet der Begriff E-Procurement?",
            options: [
              "Die Beschaffung ausschließlich über Faxgeräte",
              "Die Beschaffung von Gütern und Dienstleistungen unter Nutzung des Internets sowie spezieller Informations- und Kommunikationssysteme",
              "Die Verlagerung der gesamten IT in die Cloud",
              "Die Beschaffung über reine Telefonbestellungen"
            ],
            correct: 1,
            explain: "E-Procurement (elektronische Beschaffung) ist die Beschaffung von Gütern und Dienstleistungen unter Nutzung des Internets und spezieller IT-Systeme. Formen: E-Shops der Lieferanten, eigene Beschaffungssysteme großer Unternehmen, Marktplatzsysteme. Oft wird Datenaustausch via EDI oder XML in das ERP-System integriert.",
            source: "LF 2, Kap. 2.8" },
          { type: "tf", q: "Bei der Warenannahme reicht eine einmalige Sichtprüfung beim Eintreffen - eine spätere, genauere Kontrolle ist nicht mehr erforderlich.",
            correct: false,
            explain: "Falsch. Die Warenannahme erfolgt in zwei Schritten: erstens eine äußere Sichtkontrolle in Anwesenheit des Frachtführers (Verpackung, Lieferdokumente), zweitens eine genauere Kontrolle nach dessen Abgang (Menge, Art, Qualität, ggf. Stichproben). Unternehmen müssen Lieferungen unverzüglich prüfen - sonst können spätere Mängelansprüche abgelehnt werden.",
            source: "LF 2, Kap. 2.8" },
          { type: "mc", q: "Welcher Zeitraum gilt grundsätzlich als gesetzliche Gewährleistungsfrist für Mängel an gelieferter Ware?",
            options: [
              "6 Monate",
              "1 Jahr",
              "2 Jahre",
              "5 Jahre"
            ],
            correct: 2,
            explain: "Innerhalb der gesetzlichen Gewährleistungszeit von 2 Jahren können Mängel angezeigt werden. Besonderheit: Innerhalb der ersten 6 Monate nach Lieferung muss der Verkäufer nachweisen, dass die Ware bei Übertragung mangelfrei war (Beweislastumkehr) - danach kehrt sich die Beweislast um.",
            source: "LF 2, Kap. 2.8" },
          { type: "fill", q: "Wie heißt das Prinzip, bei dem ein IT-Produkt (z.B. ein Server oder PC) erst nach individueller Online-Konfiguration durch den Kunden produziert wird? (Abkürzung mit drei Buchstaben)",
            answers: ["BTO", "Build-to-Order", "Build to Order"],
            explain: "BTO (Build-to-Order) bedeutet \"Fertigung nach Auftrag\". Viele Hersteller (z.B. Dell, HP, Lenovo) bieten in ihren Online-Shops Konfiguratoren an, mit denen Kunden Computer und Server nach ihren Anforderungen zusammenstellen. Erst dann wird produziert.",
            source: "LF 2, Kap. 2.8" },
          { type: "mc", q: "Welche Aussage zu Rahmenverträgen mit Lieferanten trifft zu?",
            options: [
              "Rahmenverträge gelten nur für Einmalbeschaffungen",
              "Für große Unternehmen und Behörden sind Rahmenverträge mit Lieferanten von Gütern und Dienstleistungen eine Selbstverständlichkeit",
              "Rahmenverträge sind in Deutschland gesetzlich untersagt",
              "Rahmenverträge legen ausschließlich die Lieferzeit fest"
            ],
            correct: 1,
            explain: "Für große Unternehmen und Behörden sind Rahmenverträge selbstverständlich. Sie regeln über einen längeren Zeitraum Konditionen für wiederkehrende Beschaffungen (Preise, Konditionen, Mengen, Service). Auf dieser Basis lassen sich einzelne Abrufaufträge schnell und ohne neue Verhandlungen abwickeln.",
            source: "LF 2, Kap. 2.8" },
          { type: "multi", q: "Welche Faktoren beeinflussen die Frage \"Wie viel soll beschafft werden?\" (Mehrfachauswahl)",
            options: [
              "Beschaffungsart (Einzel- oder Vorratsbeschaffung)",
              "Bestellvorschläge des ERP-Systems",
              "Lieblingsfarbe der Geschäftsführung",
              "Artikelart (ABC-Artikel)",
              "Lagerkapazität und zu erwartender Verbrauch"
            ],
            correct: [0, 1, 3, 4],
            explain: "Die Bestellmenge hängt ab von: Beschaffungsart (Einzel-/Vorrat), ERP-Bestellvorschlägen, Artikelart (ABC), Lagerkapazität, erwartetem Absatz/Verbrauch, Preiskonditionen und -schwankungen sowie sonstigen Bedingungen wie Sicherheitsbeständen. Geschmacksfragen spielen keine Rolle.",
            source: "LF 2, Kap. 2.8" }
        ]
      },
      "2.9": {
        title: "Angebotsvergleich und Nutzwertanalyse",
        questions: [
          { type: "mc", q: "Bei einem Angebotsvergleich sollen nicht nur quantitative (Preis), sondern auch qualitative Kriterien wie Service, Lieferzuverlässigkeit oder bisherige Zusammenarbeit gewichtet einfließen. Welche Methode wird dafür eingesetzt?",
            options: ["ABC-Analyse","Nutzwertanalyse","SWOT-Analyse","Pareto-Analyse"],
            correct: 1,
            explain: "Die Nutzwertanalyse kombiniert quantitative und qualitative Kriterien in einer gewichteten Bewertung. Jedes Kriterium erhält ein Gewicht (in %), jedes Angebot eine Punktzahl pro Kriterium - daraus ergibt sich ein Gesamtnutzwert. Wichtig: Die Kriterien sollten gut voneinander abgegrenzt sein und sich nicht gegenseitig bedingen.",
            source: "LF 2, Kap. 2.9.3" },
          { type: "tf", q: "Im Angebotsvergleich ist immer das Angebot mit dem niedrigsten Einstandspreis auszuwählen.",
            correct: false,
            explain: "Falsch. Nicht der niedrigste Einstandspreis, sondern das wirtschaftlichste Angebot ist auszuwählen - also das mit dem besten Preis-/Leistungsverhältnis. Folgekosten, Qualität, Service, Lieferzuverlässigkeit und weitere weiche Kriterien können den Preisvorteil deutlich überwiegen. Auch öffentliche Auftraggeber wählen das wirtschaftlichste, nicht das billigste Angebot.",
            source: "LF 2, Kap. 2.9.3" },
          { type: "mc", q: "Welche Rechnung führt im quantitativen Angebotsvergleich vom Listeneinkaufspreis zum Einstandspreis (Bezugspreis)?",
            options: ["Listeneinkaufspreis + Liefererrabatt + Liefererskonto + Bezugskosten","Listeneinkaufspreis - Liefererrabatt - Liefererskonto + Bezugskosten","Listeneinkaufspreis - Liefererrabatt + Liefererskonto - Bezugskosten","Listeneinkaufspreis + Bezugskosten - Mehrwertsteuer"],
            correct: 1,
            explain: "Die Kalkulation lautet: Listeneinkaufspreis MINUS Liefererrabatt = Zieleinkaufspreis MINUS Liefererskonto = Bareinkaufspreis PLUS Bezugskosten (z.B. Fracht, Versand) = Bezugspreis (Einstandspreis). Die Umsatzsteuer wird nicht einbezogen, da sie kein Kostenbestandteil ist.",
            source: "LF 2, Kap. 2.9.2" },
          { type: "fill", q: "Wie heißt das Zwischenergebnis in der Bezugspreiskalkulation nach Abzug des Liefererrabatts vom Listeneinkaufspreis?",
            answers: ["Zieleinkaufspreis", "Ziel-Einkaufspreis"],
            explain: "Listeneinkaufspreis minus Liefererrabatt ergibt den Zieleinkaufspreis. Davon zieht man das Liefererskonto ab und erhält den Bareinkaufspreis. Plus Bezugskosten = Bezugspreis (Einstandspreis).",
            source: "LF 2, Kap. 2.9.2" },
          { type: "mc", q: "Welche Aussage zur Umsatzsteuer im quantitativen Angebotsvergleich trifft zu?",
            options: ["Die Umsatzsteuer wird zum Bezugspreis hinzugerechnet, da sie Teil der Kosten ist","Die Umsatzsteuer wird nicht in die Kalkulation einbezogen, da sie kein Kostenbestandteil ist","Die Umsatzsteuer ersetzt im Vergleich den Liefererskonto","Die Umsatzsteuer entfällt im B2B-Bereich grundsätzlich"],
            correct: 1,
            explain: "Die Umsatzsteuer wird nicht in den Angebotsvergleich einbezogen, da sie für vorsteuerabzugsberechtigte Unternehmen kein Kostenbestandteil ist - sie wird mit der eigenen Umsatzsteuerschuld verrechnet. Verglichen werden also stets die Nettobeträge.",
            source: "LF 2, Kap. 2.9.2" },
          { type: "multi", q: "Welche der folgenden Kriterien zählen zu den typischen qualitativen Bewertungskriterien einer Nutzwertanalyse? (Mehrfachauswahl)",
            options: ["Qualität und Funktionen des Produkts","Kompetenz und Service des Lieferanten","Listeneinkaufspreis in Euro","Verhalten bei Reklamationen","Beachtung umweltgerechter Methoden"],
            correct: [0, 1, 3, 4],
            explain: "Qualitative Kriterien sind weiche, oft subjektiv zu bewertende Aspekte: Produktqualität, Lieferanten-Kompetenz, Verhalten bei Reklamationen, Umweltbewusstsein, Service, Image, bisherige Zusammenarbeit. Der Listeneinkaufspreis ist dagegen ein quantitatives, hartes Kriterium.",
            source: "LF 2, Kap. 2.9.3" },
          { type: "mc", q: "Welche rechtliche Grundlage müssen öffentliche Auftraggeber (Kommunen, Behörden) bei der Auswahl von Angeboten besonders beachten?",
            options: ["Bundesdatenschutzgesetz (BDSG)","Gesetz gegen Wettbewerbsbeschränkungen (GWB) und Vergabeordnungen (VOB, VOF, VOL)","Gewerbeordnung (GewO)","Betriebsverfassungsgesetz (BetrVG)"],
            correct: 1,
            explain: "Behörden und öffentliche Unternehmen müssen das Gesetz gegen Wettbewerbsbeschränkungen (GWB) sowie die Vergabeordnungen (VOB für Bauleistungen, VOF für freiberufliche Leistungen, VOL für sonstige Leistungen) beachten. Sie sind zur Auswahl des wirtschaftlichsten - nicht des billigsten - Angebots verpflichtet.",
            source: "LF 2, Kap. 2.9.3" },
          { type: "tf", q: "Beim qualitativen Angebotsvergleich (Nutzwertanalyse) sollten die ausgewählten Bewertungskriterien sich gegenseitig bedingen und stark überlappen, damit ein klares Ergebnis entsteht.",
            correct: false,
            explain: "Falsch. Die Kriterien sollten gut voneinander abgegrenzt sein und sich gerade NICHT gegenseitig bedingen. Sonst wird ein einzelner Aspekt doppelt gewichtet, was die Aussagekraft der Nutzwertanalyse verfälscht. Auf sachliche und nachvollziehbare Argumentation ist zu achten.",
            source: "LF 2, Kap. 2.9.3" },
          { type: "fill", q: "Wie nennt man die Vertragsart, bei der die individuelle Erstellung eines konkreten Werks (z.B. eines IT-Systems aus Komponenten) geschuldet wird?",
            answers: ["Werkvertrag"],
            explain: "Beim Werkvertrag (§ 631 BGB) wird ein konkretes Werk/Ergebnis geschuldet, nicht nur die Tätigkeit. Beispiel: individuelle Erstellung eines IT-Systems aus Komponenten. Standardprodukte fallen dagegen unter Kaufvertragsrecht, reine Tätigkeiten (z.B. Beratung) unter Dienstleistungsvertragsrecht.",
            source: "LF 2, Kap. 2.9.4" },
          { type: "mc", q: "Welche Kostenarten gehören laut Lehrbuch in die Wirtschaftlichkeitsbetrachtung über den reinen Anschaffungspreis hinaus?",
            options: ["Ausschließlich der Netto-Kaufpreis","Anschaffungs-, Folge- (Verbrauch, Wartung, Reparatur) und Restwertbetrachtungen","Nur die Mehrwertsteuer","Nur die Schulungskosten"],
            correct: 1,
            explain: "In die Wirtschaftlichkeitsbetrachtung gehören: Anschaffungskosten (inkl. Bezugskosten, Installations- und Schulungskosten), Folgekosten (Verbrauch, Reparatur, Wartung), Restwerte (Wertverlust über die Nutzungsdauer) sowie qualitative Aspekte. Der reine Listenpreis greift zu kurz.",
            source: "LF 2, Kap. 2.9.3" },
          { type: "multi", q: "Welche Schritte gehören typischerweise in einen quantitativen Angebotsvergleich mehrerer Lieferanten? (Mehrfachauswahl)",
            options: ["Berechnung des Bezugspreises (Einstandspreises) je Lieferant","Berücksichtigung von Rabatten und Skonti","Berücksichtigung der Mehrwertsteuer als Kostenbestandteil","Hinzurechnen von Bezugskosten (Fracht, Versand)","Vergleich und Auswahl des günstigsten Bezugspreises"],
            correct: [0, 1, 3, 4],
            explain: "Der quantitative Angebotsvergleich rechnet: Listeneinkaufspreis - Rabatt - Skonto + Bezugskosten = Bezugspreis. Diese werden je Lieferant verglichen und der günstigste ermittelt. Die Mehrwertsteuer wird nicht einbezogen, da sie für vorsteuerabzugsberechtigte Unternehmen kein Kostenbestandteil ist.",
            source: "LF 2, Kap. 2.9.2" }
        ]
      }
    }
  },

  /* ============================================================
     LF 3 - Clients in Netzwerke einbinden (Grundstufe)
     Source: Westermann LF 1-5, Kapitel 3
     ============================================================ */
  "LF3": {
    subchapters: {
      "3.1": { title: "Einführung in das Netzwerk des Ausbildungsbetriebs", questions: [
        { type: "mc", q: "Welche Aussage zur IP-Adresse im LAN trifft zu?",
          options: [
            "Mehrere Geräte können sich eine IP-Adresse teilen, solange sie an unterschiedlichen Switches hängen",
            "Jedes Gerät im LAN hat eine eindeutige IP-Adresse, über die es adressiert werden kann",
            "Nur Server bekommen eine IP-Adresse, Clients nicht",
            "IP-Adressen werden ausschließlich für den Internetzugang benötigt"
          ],
          correct: 1,
          explain: "Jedes Gerät (Device) im LAN hat eine eindeutige IP-Adresse, über die es angesprochen wird. Das IP (Internet Protocol) transportiert Datenpakete an den Rechner mit der angegebenen Ziel-IP-Adresse - sowohl im internen Netzwerk als auch ins Internet.",
          source: "LF 3, Kap. 3.1" },
        { type: "fill", q: "Wie nennt man das lokale, meist auf ein Betriebsgelände begrenzte Netzwerk, das ein Unternehmen für die interne Kommunikation und Datenverarbeitung einsetzt? (Abkürzung)",
          answers: ["LAN", "Local Area Network"],
          explain: "LAN steht für Local Area Network - ein lokal begrenztes Netzwerk, in der Regel auf ein Betriebsgelände begrenzt, mit Ausdehnungen bis zu mehreren Kilometern. Drahtlos heißt es WLAN (Wireless LAN).",
          source: "LF 3, Kap. 3.1" },
        { type: "tf", q: "Ein Router verbindet das LAN mit dem Internet und unterscheidet sich damit von einem Switch, der innerhalb des LANs Datenpakete weiterleitet.",
          correct: true,
          explain: "Korrekt. Switches leiten Datenpakete zielgerichtet innerhalb eines Netzwerks weiter (z.B. zwischen Endgeräten im LAN). Router verbinden mehrere Netzwerke - typisch das LAN mit dem Internet oder mit anderen Subnetzen.",
          source: "LF 3, Kap. 3.1" },
        { type: "mc", q: "Welche Aufgabe übernimmt ein Server im Netzwerk üblicherweise?",
          options: [
            "Er ersetzt den Router als Internetzugang",
            "Er stellt den Clients Dienste (Services) zur Verfügung, z.B. zentrale Datenspeicherung, E-Mail oder Telefon",
            "Er dient ausschließlich als Drucker für Großformate",
            "Er ist die Bezeichnung für das WLAN-Netzwerk"
          ],
          correct: 1,
          explain: "Server sind leistungsfähige Rechner, die im Datacenter (Rechenzentrum) untergebracht sind und Dienste im Netzwerk anbieten - zentrale Datenspeicherung, Telefonie (TK-Anlage als IP-Server), E-Mail, CRM, ERP und vieles mehr. Clients (z.B. Arbeitsplatzrechner) nutzen diese Dienste.",
          source: "LF 3, Kap. 3.1" },
        { type: "multi", q: "Welche der folgenden Geräte gehören laut Lehrbuch zu den Network Devices (Netzwerkkomponenten)? (Mehrfachauswahl)",
          options: [
            "Switch",
            "Router",
            "Access Point",
            "Tastatur",
            "Endgeräte wie PCs oder Drucker"
          ],
          correct: [0, 1, 2],
          explain: "Network Devices sind die physischen Geräte, die Datenpakete im Netzwerk weiterleiten: Switches (verbinden Endgeräte), Access Points (verbinden Mobilgeräte per WLAN), Router (verbinden mehrere Netzwerke). Endgeräte wie PCs, Drucker oder Tastaturen sind Hosts/Clients, keine Network Devices.",
          source: "LF 3, Kap. 3.1" },
        { type: "fill", q: "Wie heißt das drahtlose Netzwerk, über das Mobilgeräte wie Smartphones, Tablets oder Notebooks ins LAN eingebunden werden können? (Abkürzung)",

/* =====================================================================
   HELPERS - data shape introspection
   ===================================================================== */
function hasSubchapters(lfId) {
  const lf = QUESTIONS[lfId];
  return lf && lf.subchapters !== undefined;
}
function getSubchapterIds(lfId) {
  if (!hasSubchapters(lfId)) return [];
  return Object.keys(QUESTIONS[lfId].subchapters);
}
function getQuestionPool(lfId, subId) {
  if (!QUESTIONS[lfId]) return [];
  if (subId === null || subId === "_full") {
    // Full LF mode: combine all sub-chapters, or use flat
    if (hasSubchapters(lfId)) {
      return Object.values(QUESTIONS[lfId].subchapters).flatMap(sc => sc.questions);
    }
    return QUESTIONS[lfId].questions || [];
  }
  return QUESTIONS[lfId].subchapters[subId]?.questions || [];
}
function getTotalQuestionCount(lfId) {
  return getQuestionPool(lfId, "_full").length;
}
function getSubchapterTitle(lfId, subId) {
  return QUESTIONS[lfId]?.subchapters?.[subId]?.title || "";
}

/* =====================================================================
   STORAGE
   Schema v3:
     stats[lfId][scopeId] = { best: {attempt}, last: {attempt} }
       scopeId = "_full" or "2.4" etc.
     paused[lfId][scopeId] = { snapshot }
   ===================================================================== */
const STORAGE_KEY = "itberufe_quiz_v3";
const THEME_KEY = "itberufe_quiz_theme";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { stats: {}, paused: {} };
  } catch (e) { return { stats: {}, paused: {} }; }
}
function saveData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {}
}
function recordAttempt(lfId, scopeId, attempt) {
  const d = loadData();
  if (!d.stats[lfId]) d.stats[lfId] = {};
  if (!d.stats[lfId][scopeId]) d.stats[lfId][scopeId] = {};
  const pct = (attempt.score / attempt.total) * 100;
  const cur = d.stats[lfId][scopeId];
  const bestPct = cur.best ? (cur.best.score / cur.best.total) * 100 : -1;
  cur.last = attempt;
  if (pct > bestPct) cur.best = attempt;
  saveData(d);
}
function getStat(lfId, scopeId, which) {
  const d = loadData();
  return d.stats[lfId]?.[scopeId]?.[which] || null;
}
function clearPaused(lfId, scopeId) {
  const d = loadData();
  if (d.paused[lfId]) {
    delete d.paused[lfId][scopeId];
    if (Object.keys(d.paused[lfId]).length === 0) delete d.paused[lfId];
  }
  saveData(d);
}
function getPaused(lfId, scopeId) {
  return loadData().paused[lfId]?.[scopeId] || null;
}
function savePaused(lfId, scopeId, snapshot) {
  const d = loadData();
  if (!d.paused[lfId]) d.paused[lfId] = {};
  d.paused[lfId][scopeId] = snapshot;
  saveData(d);
}
function hasAnyPausedInLF(lfId) {
  const p = loadData().paused[lfId];
  return p && Object.keys(p).length > 0;
}

/* =====================================================================
   GLOBAL & PER-LF AVERAGES
   ===================================================================== */
function computeGlobalAverage() {
  // Average of best %ages across all (lfId, scopeId) combinations the user has attempted.
  // We count every scope the user has best-attempted (sub-chapters AND full-LFs)
  const d = loadData();
  let sum = 0, count = 0;
  Object.keys(d.stats).forEach(lfId => {
    Object.keys(d.stats[lfId]).forEach(scope => {
      const best = d.stats[lfId][scope].best;
      if (best) {
        sum += (best.score / best.total) * 100;
        count++;
      }
    });
  });
  return count === 0 ? null : { avg: sum / count, count };
}
function computeLFAverage(lfId) {
  // Average of best %ages across all scopes within this one LF.
  const d = loadData();
  const lfStats = d.stats[lfId];
  if (!lfStats) return null;
  let sum = 0, count = 0;
  Object.keys(lfStats).forEach(scope => {
    const best = lfStats[scope].best;
    if (best) {
      sum += (best.score / best.total) * 100;
      count++;
    }
  });
  return count === 0 ? null : { avg: sum / count, count };
}

/* =====================================================================
   UTILITIES
   ===================================================================== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id) {
  ["screen-select","screen-lf-detail","screen-quiz","screen-result"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[.,;:!?-]/g,"");
}
function formatDate(ts) {
  const d = new Date(ts);
  const pad = n => n.toString().padStart(2,"0");
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* =====================================================================
   THEME
   ===================================================================== */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme-icon").textContent = theme === "dark" ? "☾" : "☀";
  document.getElementById("theme-label").textContent = theme === "dark" ? "Dunkel" : "Hell";
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
}
(function initTheme() {
  let stored = "light";
  try { stored = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
  applyTheme(stored);
})();

/* =====================================================================
   OVERVIEW SCREEN
   ===================================================================== */
function renderOverview() {
  resetAccent();
  // Global stat banner
  const banner = document.getElementById("global-stat");
  const gv = document.getElementById("gs-value");
  const gm = document.getElementById("gs-meta");
  const g = computeGlobalAverage();
  if (!g) {
    banner.classList.add("empty");
    gv.textContent = "Noch keine Daten";
    gm.textContent = "Starte einen Quiz, um deine Bestleistungen zu erfassen.";
  } else {
    banner.classList.remove("empty");
    gv.textContent = Math.round(g.avg) + "%";
    gm.innerHTML = `aus ${g.count} ${g.count === 1 ? "Bestleistung" : "Bestleistungen"}<br>(Lernfelder + Unterkapitel)`;
  }

  // LF sections
  const container = document.getElementById("lf-sections");
  container.innerHTML = "";

  ["grund","fach1","fach2"].forEach(block => {
    const section = document.createElement("div");
    section.className = `lf-section ${block}`;
    const title = document.createElement("div");
    title.className = "lf-section-title";
    title.textContent = BLOCK_LABELS[block];
    section.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "lf-grid";

    LERNFELDER.filter(lf => lf.block === block).forEach(lf => {
      const btn = document.createElement("div");
      btn.className = `lf-card ${block}`;
      if (!lf.available) btn.classList.add("disabled");

      const count = lf.available ? getTotalQuestionCount(lf.id) : 0;
      const subCount = lf.available && hasSubchapters(lf.id) ? getSubchapterIds(lf.id).length : 0;
      const lfAvg = computeLFAverage(lf.id);

      let metaText;
      if (!lf.available) metaText = "in Vorbereitung";
      else if (subCount > 0) metaText = `${subCount} Unterkapitel · ${count} Fragen`;
      else metaText = `${count} Fragen im Pool`;

      let inner = `
        <div class="lf-num">${lf.num}</div>
        <div class="lf-title">${lf.title}</div>
        <div class="lf-meta">${metaText}</div>
      `;

      if (lf.available && lfAvg) {
        // Show LF-wide best/last only for flat LFs; for subchapter-LFs the average banner replaces it
        if (hasSubchapters(lf.id)) {
          inner += `<div class="lf-stats">
            <div class="lf-stat best"><span class="stat-label">Ø Bestleistung:</span> ${Math.round(lfAvg.avg)}%</div>
            <div class="lf-stat"><span class="stat-label">${lfAvg.count} ${lfAvg.count === 1 ? "Bereich" : "Bereiche"} absolviert</span></div>
          </div>`;
        } else {
          // Flat LF: best + last
          const best = getStat(lf.id, "_full", "best");
          const last = getStat(lf.id, "_full", "last");
          if (best || last) {
            inner += `<div class="lf-stats">`;
            if (best) {
              const pct = Math.round((best.score / best.total) * 100);
              inner += `<button class="lf-stat best clickable" data-act="view-best" data-lf="${lf.id}"><span class="stat-label">Bestleistung:</span> ${pct}% (${best.score}/${best.total})</button>`;
            }
            if (last) {
              const pct = Math.round((last.score / last.total) * 100);
              inner += `<button class="lf-stat clickable" data-act="view-last" data-lf="${lf.id}"><span class="stat-label">Letzter Versuch:</span> ${pct}% · ${formatDate(last.ts)}</button>`;
            }
            inner += `</div>`;
          }
        }
      }

      if (lf.available && hasAnyPausedInLF(lf.id)) {
        inner += `<div class="resume-banner">▶ Pausierte Quizze vorhanden</div>`;
      }

      btn.innerHTML = inner;

      btn.addEventListener("click", (e) => {
        if (!lf.available) return;
        const statBtn = e.target.closest("[data-act]");
        if (statBtn) {
          e.stopPropagation();
          const act = statBtn.dataset.act;
          const lfId = statBtn.dataset.lf;
          if (act === "view-best") showStoredAttempt(lfId, "_full", "best");
          if (act === "view-last") showStoredAttempt(lfId, "_full", "last");
          return;
        }
        // Flat LFs go straight into quiz; subchapter LFs go to detail screen
        if (hasSubchapters(lf.id)) {
          openLFDetail(lf.id);
        } else {
          handleQuizEntry(lf.id, "_full");
        }
      });

      grid.appendChild(btn);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}
